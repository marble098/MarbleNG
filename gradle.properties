# MARBLE_RELEASE_PACKAGING_V214 — packageRelease's IncrementalSplitterRunnable holds the
# merged native tree (500+ MB across four ABIs) once per split while it writes the five
# release APKs, on top of everything the daemon already retains from R8. At -Xmx4g that
# packaging peak intermittently killed the splitter worker (run 307: packageRelease FAILED
# with no root-cause line, the classic worker-death signature; the identical tree then
# packaged green in diagnostic run 38412976243). 6 GiB leaves headroom for the splitter
# peak plus the Kotlin daemon on the 15 GiB release runner.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=false
