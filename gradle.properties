org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=false
# AGP 9.x built-in Kotlin workaround:
# The compose plugin (org.jetbrains.kotlin.plugin.compose) 2.3.10 triggers
# a kapt application that conflicts with AGP 9.2.1 built-in Kotlin.
# These flags disable built-in Kotlin to unblock CI.
# TODO: Remove once compose plugin is updated for AGP 9.2.1 built-in Kotlin.
android.builtInKotlin=false
android.newDsl=false