name: arena-probe
on:
  push:
    branches:
      - arena/b26531a4-marbleng
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe toolchain versions
        shell: bash
        run: |
          set -uo pipefail
          py() { python3 "$@"; }
          echo "=== gradle versions (all, tail) ==="
          curl -fsSL --max-time 30 https://services.gradle.org/versions/all | python3 -c "
import json,sys
data=json.load(sys.stdin)
active=[d for d in data if not d.get('snapshot')]
for d in active[:25]:
    print(d['version'], 'rc' if 'rc' in d['version'] else '', d.get('buildTime',''))
"
          echo "=== gradle current ==="
          curl -fsSL --max-time 30 https://services.gradle.org/versions/current | head -c 400
          echo
          for coord in \
            "google:com.android.tools.build:gradle" \
            "google:com.android.tools.build:aapt2" \
            "central:org.jetbrains.kotlin:kotlin-gradle-plugin" \
            "central:org.jetbrains.kotlin:kotlin-compose-compiler-plugin-embeddable" \
            "google:androidx.compose:compose-bom" \
            "google:androidx.core:core-ktx" \
            "google:androidx.activity:activity-compose" \
            "google:androidx.lifecycle:lifecycle-runtime-ktx" \
            "central:com.github.mwiede:jsch" \
            "central:com.google.zxing:core" \
            "central:junit:junit" \
            "central:org.json:json" \
            ; do
            repo="${coord%%:*}"; rest="${coord#*:}"; group="${rest%%:*}"; artifact="${rest##*:}"
            gpath="$(echo "$group" | tr '.' '/')"
            case "$repo" in
              google) base="https://dl.google.com/dl/android/maven2" ;;
              central) base="https://repo1.maven.org/maven2" ;;
            esac
            url="$base/$gpath/$artifact/maven-metadata.xml"
            echo "=== $group:$artifact ==="
            curl -fsSL --max-time 30 "$url" | python3 -c "
import sys,re
text=sys.stdin.read()
vs=re.findall(r'<version>([^<]+)</version>', text)
rel=re.search(r'<release>([^<]+)</release>', text)
lat=re.search(r'<latest>([^<]+)</latest>', text)
print('release:', rel.group(1) if rel else '?', ' latest:', lat.group(1) if lat else '?', ' count:', len(vs))
print('  tail:', ', '.join(vs[-14:]))
" || echo "  (failed)"
          done
