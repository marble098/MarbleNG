name: Source verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marbleng-source-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/*.sh

      - name: Validate core lock
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.xray.tag and .hev.tag' core-lock.json

      - name: Reject malformed Compose function types
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          bad=[]
          pattern=re.compile(r':\s*@Composable\(\)\s*->')
          for path in Path('app/src/main/java').rglob('*.kt'):
              data=path.read_text(encoding='utf-8')
              if pattern.search(data):
                  bad.append(str(path))
          if bad:
              raise SystemExit('Malformed @Composable function type: ' + ', '.join(bad))
          PY

      - name: Verify routing source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          models=Path('app/src/main/java/com/marbleng/app/model/Models.kt').read_text()
          hardener=Path('app/src/main/java/com/marbleng/app/core/XrayConfigHardener.kt').read_text()
          identity=Path('app/src/main/java/com/marbleng/app/core/IdentityGuard.kt').read_text()
          build=Path('.github/workflows/build.yml').read_text()
          required={
              'geoip source':'Iran-v2ray-rules/release/geoip.dat' in models,
              'geosite source':'Iran-v2ray-rules/release/geosite.dat' in models,
              'geo direct default':'RoutingMode.GEO_DIRECT' in models,
              'ads default':'val routeBlockAds: Boolean = true' in models,
              'IPIfNonMatch':'IPIfNonMatch' in models,
              'normalized ad tag':'normalizeGeoSiteTag(settings.routeAdsTag)' in hardener,
              'proxy fallback':'Unmatched routing fallback must stay on the selected proxy' in hardener,
              'bounded identity direct':'RoutingDefaults.GEOSITE_DIRECT_TAGS' in identity,
              'bundled routing assets':'Bundle verified Iran routing assets' in build,
          }
          failed=[k for k,v in required.items() if not v]
          if failed:
              raise SystemExit('Routing invariant failure: ' + ', '.join(failed))
          PY

      - name: Source-wide Marble regression audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('.')
          scanned=0
          decode_fail=[]
          for ext in ('*.kt','*.kts','*.xml','*.yml','*.yaml','*.sh','*.pro'):
              for path in root.rglob(ext):
                  if any(part in {'.git','.gradle','build'} for part in path.parts):
                      continue
                  scanned += 1
                  try:
                      path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      decode_fail.append(str(path))

          if decode_fail:
              raise SystemExit('Non UTF-8 source files: '+', '.join(decode_fail))

          ui=Path('app/src/main/java/com/marbleng/app/ui/Aether2026.kt').read_text()
          repo=Path('app/src/main/java/com/marbleng/app/AppRepository.kt').read_text()
          vpn=Path('app/src/main/java/com/marbleng/app/vpn/MarbleVpnService.kt').read_text()
          socks=Path('app/src/main/java/com/marbleng/app/core/SocksHttpClient.kt').read_text()

          strict={
              'v9.1 marker':'Marble Product UI v9.1.0' in ui,
              'no glyph-font tab icons':'val glyph: String' not in ui,
              'Canvas tab icons':'private fun MarbleTabIcon(' in ui,
              'no raw Material Switch':'SwitchDefaults.colors(' not in ui,
              'custom Marble toggle':'private fun MarbleToggle(' in ui,
              'live route score state':'var liveRouteScore by mutableStateOf(-1)' in repo,
              'live score samples':'var liveRouteSamples by mutableStateOf(0)' in repo,
              'scientific decay score':'calculateLiveRouteScore' in repo and 'latencyFactor' in repo,
              'fast initial route sample':vpn.count('sampleRouteLatency(session, port, generation)') >= 3,
              'adaptive live cadence':'ROUTE_PROBE_INTERVAL_TICKS = 20' in vpn and 'ROUTE_DEGRADED_PROBE_TICKS = 8' in vpn,
              'verified live RTT':'httpsFirstByteLatency(' in socks and 'verified-https-ttfb' in vpn,
              'jitter readiness model':'liveJitterSamples' in repo and 'jitterSampleCount' in vpn,
              'bounded ping window':'ROUTE_WINDOW_SIZE = 5' in vpn and 'JITTER_WINDOW_SIZE = 6' in vpn,
              'split list not truncated':'.take(48)' not in ui,
              'old race score floor absent':'maxOf(80.0, raced.second.score)' not in repo,
              'fast page motion':'marble-page-transition-fast' in ui,
          }
          failed=[k for k,v in strict.items() if not v]
          if failed:
              raise SystemExit('Regression audit failure: '+', '.join(failed))

          suspicious=[]
          forbidden_patterns={
              'GlobalScope':r'\bGlobalScope\.',
              'blocking UI sleep':r'Aether2026\.kt.*Thread\.sleep',
          }
          all_kotlin='\n'.join(
              p.read_text(encoding='utf-8')
              for p in Path('app/src/main/java').rglob('*.kt')
          )
          if re.search(forbidden_patterns['GlobalScope'],all_kotlin):
              suspicious.append('GlobalScope usage')

          if suspicious:
              raise SystemExit('Source-wide unsafe pattern: '+', '.join(suspicious))

          print(f'[OK] source-wide audit scanned {scanned} text source files')
          PY

      - name: Verify Product UI v9.1 invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          ui=Path('app/src/main/java/com/marbleng/app/ui/Aether2026.kt').read_text()
          repo=Path('app/src/main/java/com/marbleng/app/AppRepository.kt').read_text()
          vpn=Path('app/src/main/java/com/marbleng/app/vpn/MarbleVpnService.kt').read_text()
          required={
              'v9.1 marker':'Marble Product UI v9.1.0' in ui,
              'modern Canvas icons':'MarbleTabIcon(' in ui,
              'custom off toggle':'MarbleToggle(' in ui and 'SwitchDefaults.colors(' not in ui,
              'connected score prioritizes live':'repo.liveRouteScore' in ui,
              'live score model':'calculateLiveRouteScore' in repo,
              'live sample count':'liveRouteSamples' in repo,
              'immediate active probe':'The dashboard should become meaningful as soon as Xray is live' in vpn,
              'fast navigation':'marble-page-transition-fast' in ui,
          }
          failed=[k for k,v in required.items() if not v]
          if failed:
              raise SystemExit('Product UI v9.1 invariant failure: '+', '.join(failed))
          print('[OK] Product UI v9.1 invariants')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Compile Kotlin source
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugKotlin :app:compileReleaseKotlin
