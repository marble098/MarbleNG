name: Source verification
# MARBLE_RUNTIME_STARTUP_RESCUE_V21
# MARBLE_IRAN_JITTER_UI_V22

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # MARBLE_TOOLCHAIN_AUTOPILOT_V211 — a red run publishes what failed as a comment on the pull
  # request, because a log download is not available to every reader of this repository.
  pull-requests: write

concurrency:
  group: marbleng-source-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # MARBLE_SINGBOX_GO127_FORCE_CLOSE_V161 — the sing-box pinned-source smoke downloads
    # the fork's Go modules and links the whole core on the host, which the previous
    # 25-minute budget did not have room for.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/*.sh

      # MARBLE_LATEST_VERSION_RULE_V235 — the one update rule (newest *published* version wins,
      # beta or release) proven offline against recorded release lists: a stable published after
      # a beta wins, a beta after a stable wins, a draft never wins, same-instant ties break by
      # version. This is the branch the old `prerelease` channel got wrong in production.
      - name: Core update rule fixtures
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/test-core-lock-rule.sh

      # MARBLE_TOOLCHAIN_AUTOPILOT_V211 — what the newest published version of every
      # component this build is made of actually is, printed on every source verification. The
      # resolver is the same file the scheduled updater writes `gradle/toolchain.properties`
      # with, and the report is informational: the pins are the build's floor, and a repository
      # that is unreachable must not turn into a red release.
      - name: Report newest toolchain versions
        continue-on-error: true
        shell: bash
        run: python3 scripts/resolve-toolchain.py

      - name: Validate core lock
        shell: bash
        run: |
          set -euo pipefail
          # MARBLE_SINGBOX_CORE_V151 — three pinned cores now: Xray, hev-socks5-tunnel and
          # sing-box extended. A lock missing any one of them must fail here, before a 40-minute
          # native build discovers it.
          jq -e '.xray.tag and .xray.repo' core-lock.json
          jq -e '.hev.tag and .hev.repo' core-lock.json
          jq -e '.singbox.tag and .singbox.repo' core-lock.json
          jq -e '.tun2socks.tag and .tun2socks.repo and .tun2socks.commit' core-lock.json

      - name: Core versions agree everywhere
        shell: bash
        run: |
          set -euo pipefail
          # MARBLE_CORE_VERSION_PARITY_V151 — Settings → Information prints these three tags, so
          # they have to be the tags the APK is actually built with. Nothing may hard-code a
          # version: the gradle build and the native script both have to read core-lock.json, and
          # the updater has to be the only thing that writes it.
          XRAY_TAG="$(jq -r '.xray.tag' core-lock.json)"
          HEV_TAG="$(jq -r '.hev.tag' core-lock.json)"
          SINGBOX_TAG="$(jq -r '.singbox.tag' core-lock.json)"
          TUN2SOCKS_TAG="$(jq -r '.tun2socks.tag' core-lock.json)"

          for pair in "xray:$XRAY_TAG" "hev:$HEV_TAG" "singbox:$SINGBOX_TAG" "tun2socks:$TUN2SOCKS_TAG"; do
            component="${pair%%:*}"
            tag="${pair#*:}"
            [[ -n "$tag" && "$tag" != "null" ]] || { echo "empty tag for $component"; exit 1; }
          done

          grep -q 'coreLockField("xray", "tag")' app/build.gradle.kts
          grep -q 'coreLockField("hev", "tag")' app/build.gradle.kts
          grep -q 'coreLockField("singbox", "tag")' app/build.gradle.kts
          grep -q 'SINGBOX_CORE_TAG' app/build.gradle.kts
          grep -q 'coreLockField("tun2socks", "tag")' app/build.gradle.kts
          grep -q 'TUN2SOCKS_CORE_TAG' app/build.gradle.kts

          grep -q ".xray.tag" scripts/prepare-native.sh
          grep -q ".hev.tag" scripts/prepare-native.sh
          grep -q ".singbox.tag" scripts/prepare-native.sh
          grep -q "libsingbox.so" scripts/prepare-native.sh
          grep -q ".tun2socks.tag" scripts/prepare-native.sh
          grep -q "libtun2socks.so" scripts/prepare-native.sh
          grep -q "libtun2socks.so" app/build.gradle.kts

          # MARBLE_LATEST_VERSION_RULE_V235 — one rule for every core: the newest published
          # (non-draft) release by published_at, beta or release or any other label. There are
          # no channels left to drift: the lock stamps the rule, each core carries the commit
          # its tag resolved to plus the publication instant that won it the pin, and the
          # fixture step above proves the picker on every branch of the rule.
          [[ "$(jq -r '.rule' core-lock.json)" == "latest-published" ]]
          jq -e '[.xray, .hev, .singbox, .tun2socks] | all(has("channel") | not)' core-lock.json >/dev/null
          [[ "$(jq -r '.singbox.repo' core-lock.json)" == "shtorm-7/sing-box-extended" ]]
          [[ "$(jq -r '.tun2socks.repo' core-lock.json)" == "xjasonlyu/tun2socks" ]]
          for core in xray hev singbox tun2socks; do
            [[ "$(jq -r ".${core}.commit" core-lock.json)" =~ ^[0-9a-f]{40}$ ]]
            [[ "$(jq -r ".${core}.publishedAt" core-lock.json)" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]
            jq -e ".${core} | has(\"prerelease\")" core-lock.json >/dev/null
          done
          grep -q "published_at" scripts/update-core-lock.sh
          grep -q "MARBLE_LATEST_VERSION_RULE_V235" scripts/update-core-lock.sh
          ! grep -q "releases/latest" app/src/main/java/com/marbleng/app/AppRepository.kt

          # A hard-coded version string anywhere outside the lock is drift waiting to happen.
          ! grep -RnoE "v26\.[0-9]+\.[0-9]+" app/build.gradle.kts scripts/prepare-native.sh
          ! grep -RnoE "1\.14\.0-extended" app/build.gradle.kts scripts/prepare-native.sh
          ! grep -RnoE "v2\.[0-9]+\.[0-9]+" app/build.gradle.kts scripts/prepare-native.sh

      - name: Realtime Xray native smoke
        shell: bash
        run: |
          set -euo pipefail
          # MARBLE_REALTIME_ENGINE_V70
          XRAY_TAG="$(jq -r '.xray.tag' core-lock.json)"
          XRAY_TMP="$RUNNER_TEMP/xray-realtime-smoke"

          rm -rf "$XRAY_TMP"
          git clone --quiet --depth 1 --branch "$XRAY_TAG" \
            https://github.com/XTLS/Xray-core.git "$XRAY_TMP"

          cp native/rankhelper/main.go "$XRAY_TMP/main/marble_rank.go"
          python3 scripts/inject-xray-realtime.py "$XRAY_TMP"

          # MARBLE_CORE_CONFIG_SUPERSET_V165 — the one policy patch MarbleNG applies to its core must
          # be proven against the pinned tag, in CI, before an APK is ever built: if upstream renames
          # `requiresTransportSecurity` the injector fails with an anchor message instead of shipping
          # a core that refuses every plaintext node.
          python3 scripts/inject-xray-config-superset.py "$XRAY_TMP"
          cp native/xraypatch/marble_outbound_policy_test.go "$XRAY_TMP/infra/conf/marble_outbound_policy_test.go"
          grep -F 'if marbleAllowsUnencryptedOutbound() {' "$XRAY_TMP/infra/conf/xray.go" >/dev/null

          python3 - "$XRAY_TMP/main/main.go" <<'PYXRAY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          old = "\t\t\tcmdRun,\n\t\t\tcmdVersion,\n"
          new = "\t\t\tcmdRun,\n\t\t\tcmdVersion,\n\t\t\tcmdMarbleRank,\n"

          if source.count(old) != 1:
              raise SystemExit("Pinned Xray command anchor changed")

          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PYXRAY

          (
            cd "$XRAY_TMP"
            env GOTOOLCHAIN=auto go test ./transport/internet ./main
            # Only MarbleNG's own cases in `infra/conf`: compiling the package is the point (it
            # proves the patch is syntactically and type-wise sound at the pinned tag), while
            # upstream's own suite in that package is not MarbleNG's to keep green here.
            env GOTOOLCHAIN=auto go test -run 'TestMarble' ./infra/conf
          )

      # ======================================================================
      # sing-box pinned-source smoke — the run #247 class of failure
      # ======================================================================
      # MARBLE_SINGBOX_GO127_FORCE_CLOSE_V161 — the release build resolves its Go
      # toolchain from the pinned Xray's go.mod, and the core-lock bot bumped that
      # pin (v26.7.28 -> v26.9.9, `go 1.26` -> `go 1.27`) straight to main with a
      # GITHUB_TOKEN push that triggers no build. The first build after the bump
      # (run #247, the merge of PR #135) then died at the sing-box link step,
      # because the pinned sing-box's v2rayxhttp still linknamed a pre-1.27
      # x/net/http2 symbol. A PR-time gate never sees the pinned sing-box's link
      # surface unless it builds it — with the same toolchain the release build
      # will use — so this smoke does exactly that: clone the pinned commit,
      # inject both backports, run the injected regression tests, and link the
      # whole core with the release tag set on the host.
      - name: Clone the pinned sing-box source and the pinned Xray toolchain pin
        shell: bash
        run: |
          set -euo pipefail

          SINGBOX_REPO="$(jq -r '.singbox.repo' core-lock.json)"
          SINGBOX_TAG="$(jq -r '.singbox.tag' core-lock.json)"
          SINGBOX_COMMIT="$(jq -r '.singbox.commit // empty' core-lock.json)"
          XRAY_TAG="$(jq -r '.xray.tag' core-lock.json)"

          [[ -n "$SINGBOX_TAG" && "$SINGBOX_TAG" != "null" ]]
          [[ -n "$SINGBOX_COMMIT" && "$SINGBOX_COMMIT" != "null" ]]
          [[ -n "$XRAY_TAG" && "$XRAY_TAG" != "null" ]]

          SB_TMP="$RUNNER_TEMP/singbox-link-smoke"
          XRAY_PIN="$RUNNER_TEMP/xray-toolchain-pin"

          rm -rf "$SB_TMP" "$XRAY_PIN"
          mkdir -p "$XRAY_PIN"

          git clone --quiet --depth 1 --branch "$SINGBOX_TAG" \
            "https://github.com/${SINGBOX_REPO}.git" "$SB_TMP"

          # The pin is the commit, not the tag: a re-pointed tag must fail here rather
          # than quietly compile a different core than the one the backports were read
          # against.
          [[ "$(git -C "$SB_TMP" rev-parse HEAD)" == "$SINGBOX_COMMIT" ]] || {
            echo "::error::Pinned sing-box tag $SINGBOX_TAG is not the pinned commit $SINGBOX_COMMIT."
            exit 1
          }

          # The toolchain pin is the only thing taken from Xray: build.yml's setup-go
          # resolves the release toolchain from exactly this go.mod. Whatever Go this
          # runner had before is irrelevant — the pinned Xray's directive is the
          # toolchain the release build will compile the core with.
          git clone --quiet --depth 1 --branch "$XRAY_TAG" \
            https://github.com/XTLS/Xray-core.git "$XRAY_PIN/xray"

          test -s "$XRAY_PIN/xray/go.mod"

          echo "Pinned sing-box: $SINGBOX_TAG @ $SINGBOX_COMMIT"
          echo "Pinned Xray    : $XRAY_TAG (toolchain pin)"
          grep '^go ' "$XRAY_PIN/xray/go.mod"

      - name: Set up the pinned Xray Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: "${{ runner.temp }}/xray-toolchain-pin/xray/go.mod"
          cache: false

      - name: sing-box pinned-source smoke (inject, regression tests, host link)
        shell: bash
        run: |
          set -euo pipefail

          SB_TMP="$RUNNER_TEMP/singbox-link-smoke"

          (
            cd "$SB_TMP"

            # Both backports, exactly as the release build applies them.
            python3 "$GITHUB_WORKSPACE/scripts/inject-singbox-android-fix.py" "$SB_TMP"
            python3 "$GITHUB_WORKSPACE/scripts/inject-singbox-go127-fix.py" "$SB_TMP"

            # Every patched site must carry its marker, or the release build's grep
            # has nothing to find and an unpatched file ships silently.
            for patched in \
              protocol/direct/outbound.go \
              route/network.go \
              dns/transport/dhcp/dhcp.go \
              route/rule/rule_default_interface_address.go \
              route/rule/rule_network_interface_address.go
            do
              grep -F 'MARBLE_SINGBOX_ANDROID_CLI_CRASH_V157' "$patched" >/dev/null
            done

            grep -F 'MARBLE_SINGBOX_GO127_FORCE_CLOSE_V161' transport/v2rayxhttp/dialer.go >/dev/null
            if [[ -d common/force_close ]]; then
              # v1.14.1-extended-2.7.2 and newer: the fork ships the three-way split
              # itself as a shared package; the injector verified it (build tags and
              # every pulled symbol) instead of writing variant files here.
              test -f common/force_close/force_close_legacy.go
              test -f common/force_close/force_close_go127.go
              test -f common/force_close/force_close_go127_stub.go
              grep -F 'func ResetTransport(' common/force_close/force_close.go >/dev/null
              grep -F '//go:build go1.27 && badlinkname' \
                common/force_close/force_close_go127.go >/dev/null
            else
              for variant in \
                force_close_legacy.go \
                force_close_go127.go \
                force_close_go127_stub.go
              do
                grep -F 'MARBLE_SINGBOX_GO127_FORCE_CLOSE_V161' "transport/v2rayxhttp/$variant" >/dev/null
              done
            fi

            # Idempotence: a second run must be a no-op, or the release build's single
            # run is not the tree these tests are about to validate. "already patched"
            # is the older pin's marker; "already verified" is the 2.7.2+ verifier's.
            python3 "$GITHUB_WORKSPACE/scripts/inject-singbox-android-fix.py" "$SB_TMP" | grep -E 'already patched|already verified'
            python3 "$GITHUB_WORKSPACE/scripts/inject-singbox-go127-fix.py" "$SB_TMP" | grep -E 'already patched|already verified'

            # The injected crash regression tests (nil interface monitor).
            env GOTOOLCHAIN=auto CGO_ENABLED=0 go test ./protocol/direct ./route ./dns/transport/dhcp

            # The MARBLE_SINGBOX_GO127_FORCE_CLOSE_V161 link pin: compiles AND links
            # the force-close variant the running toolchain selects, with the same
            # badlinkname tag the release build uses. From 2.7.2 on the linknames
            # live in the fork's common/force_close package, so it is pinned too.
            FORCE_CLOSE_PKGS=(./transport/v2rayxhttp)
            if [[ -d common/force_close ]]; then FORCE_CLOSE_PKGS+=(./common/force_close); fi
            env GOTOOLCHAIN=auto CGO_ENABLED=0 go test \
              -tags badlinkname -ldflags "-checklinkname=0" \
              "${FORCE_CLOSE_PKGS[@]}"
          )

          # The release tag set, read from the file that owns it — never duplicated
          # here, or this smoke would drift from the build it guards.
          SINGBOX_TAGS="$(
            sed -n 's/^SINGBOX_TAGS="\([^"]*\)".*/\1/p' "$GITHUB_WORKSPACE/scripts/prepare-native.sh" | head -n1
          )"

          [[ -n "$SINGBOX_TAGS" ]] || {
            echo "::error::Could not read SINGBOX_TAGS from scripts/prepare-native.sh."
            exit 1
          }

          (
            cd "$SB_TMP"
            env \
              GOTOOLCHAIN=auto \
              CGO_ENABLED=0 \
              GOOS=linux \
              GOARCH=amd64 \
              go build \
                -tags "$SINGBOX_TAGS" \
                -ldflags "-checklinkname=0" \
                -o "$RUNNER_TEMP/singbox-link-smoke-bin" \
                ./cmd/sing-box
          )

          test -s "$RUNNER_TEMP/singbox-link-smoke-bin"
          echo "[OK] pinned sing-box links under the pinned Xray's toolchain with the release tags"

      # ======================================================================
      # tun2socks pinned-source smoke — MARBLE_TUN2SOCKS_CORE_V222
      # ======================================================================
      # The second datapath is a Go c-shared library, so the Kotlin compiler
      # never sees it and the release build is the first thing that would. This
      # smoke compiles the exact wrapper the release build copies into the
      # pinned tree, then calls its exported ABI through ctypes: a rejected
      # descriptor and an unsupported proxy scheme have to come back as error
      # codes. If the wrapper ever falls back to engine.Start()/log.Fatalf(),
      # the process dies here instead of inside a user's VPN process.
      - name: tun2socks pinned-source smoke (wrapper ABI and error path)
        shell: bash
        run: |
          set -euo pipefail

          TUN2SOCKS_REPO="$(jq -r '.tun2socks.repo' core-lock.json)"
          TUN2SOCKS_TAG="$(jq -r '.tun2socks.tag' core-lock.json)"
          TUN2SOCKS_COMMIT="$(jq -r '.tun2socks.commit' core-lock.json)"

          SRC="$RUNNER_TEMP/tun2socks-src"
          rm -rf "$SRC"
          git clone --quiet --depth 1 --branch "$TUN2SOCKS_TAG" \
            "https://github.com/${TUN2SOCKS_REPO}.git" "$SRC"

          [[ "$(git -C "$SRC" rev-parse HEAD)" == "$TUN2SOCKS_COMMIT" ]] || {
            echo "::error::Pinned tun2socks tag $TUN2SOCKS_TAG is not commit $TUN2SOCKS_COMMIT."
            exit 1
          }

          mkdir -p "$SRC/cmd/libmarble"
          cp native/tun2socks/main.go "$SRC/cmd/libmarble/main.go"

          (
            cd "$SRC"
            env GOTOOLCHAIN=auto CGO_ENABLED=1 go vet ./cmd/libmarble
            env GOTOOLCHAIN=auto CGO_ENABLED=1 go build \
              -buildmode=c-shared \
              -trimpath \
              -buildvcs=false \
              -ldflags "-X main.buildVersion=${TUN2SOCKS_TAG} -checklinkname=0" \
              -o "$RUNNER_TEMP/libtun2socks-smoke.so" \
              ./cmd/libmarble
          )

          python3 - "$RUNNER_TEMP/libtun2socks-smoke.so" "$TUN2SOCKS_TAG" <<'PYT2S'
          import ctypes
          import os
          import sys

          library = ctypes.CDLL(sys.argv[1])
          expected_version = sys.argv[2].encode()

          library.marble_t2s_version.restype = ctypes.c_char_p
          assert library.marble_t2s_version() == expected_version, "version marker"

          library.marble_t2s_run.restype = ctypes.c_int
          library.marble_t2s_run.argtypes = [
              ctypes.c_char_p, ctypes.c_int, ctypes.c_int, ctypes.c_int,
              ctypes.c_longlong, ctypes.c_longlong, ctypes.c_int,
              ctypes.c_char_p, ctypes.c_char_p,
          ]

          rejected_descriptor = library.marble_t2s_run(
              b"socks5://127.0.0.1:1080", 1500, -1, 60, 0, 0, 0, b"error", b"")
          assert rejected_descriptor == -5, f"invalid fd returned {rejected_descriptor}"

          devnull = os.open(os.devnull, os.O_RDWR)
          try:
              rejected_proxy = library.marble_t2s_run(
                  b"http://127.0.0.1:1080", 1500, devnull, 60, 0, 0, 0, b"error", b"")
              assert rejected_proxy == -2, f"unsupported proxy returned {rejected_proxy}"
          finally:
              os.close(devnull)

          library.marble_t2s_error.restype = ctypes.c_char_p
          assert b"proxy" in library.marble_t2s_error().lower(), "error text"

          print("[OK] tun2socks c-shared ABI rejects bad input without exiting")
          PYT2S

      - name: Reject malformed Compose function types
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          malformed = []
          pattern = re.compile(r':\s*@Composable\(\)\s*->')

          for path in Path("app/src/main/java").rglob("*.kt"):
              source = path.read_text(encoding="utf-8")
              if pattern.search(source):
                  malformed.append(str(path))

          if malformed:
              raise SystemExit(
                  "Malformed @Composable function type: " + ", ".join(malformed)
              )

          print("[OK] Compose function-type syntax is valid")
          PY

      - name: Verify routing source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          models = Path(
              "app/src/main/java/com/marbleng/app/model/Models.kt"
          ).read_text(encoding="utf-8")

          hardener = Path(
              "app/src/main/java/com/marbleng/app/core/XrayConfigHardener.kt"
          ).read_text(encoding="utf-8")

          identity = Path(
              "app/src/main/java/com/marbleng/app/core/IdentityGuard.kt"
          ).read_text(encoding="utf-8")

          build = Path(
              ".github/workflows/build.yml"
          ).read_text(encoding="utf-8")

          required = {
              "geoip source": "Iran-v2ray-rules/release/geoip.dat" in models,
              "geosite source": "Iran-v2ray-rules/release/geosite.dat" in models,
              "geo direct default": "RoutingMode.GEO_DIRECT" in models,
              "ads default": "val routeBlockAds: Boolean = true" in models,
              "IPIfNonMatch": "IPIfNonMatch" in models,
              "normalized ad tag": (
                  "normalizeGeoSiteTag(settings.routeAdsTag)" in hardener
              ),
              "proxy fallback": (
                  "Unmatched routing fallback must stay on the selected proxy"
                  in hardener
              ),
              "bounded identity direct": (
                  "RoutingDefaults.GEOSITE_DIRECT_TAGS" in identity
              ),
              "bundled routing assets": (
                  "Bundle verified Iran routing assets" in build
              ),
          }

          failed = [name for name, passed in required.items() if not passed]

          if failed:
              raise SystemExit(
                  "Routing invariant failure: " + ", ".join(failed)
              )

          print("[OK] Routing source invariants")
          PY

      - name: Source-wide Marble system integrity audit
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/system-integrity-check.py 2>&1 | tee integrity.log

      - name: Verify M3 Expressive Product UI invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/kotlin-structure-check.py
          python3 tools/compose-scope-check.py
          python3 - <<'PY'
          from pathlib import Path

          # MARBLE_M3_EXPRESSIVE_V240 — the one-place theme package replaced IosTheme.kt.
          marble_theme = Path(
              "app/src/main/java/com/marbleng/app/ui/theme/MarbleTheme.kt"
          ).read_text(encoding="utf-8")

          marble_color = Path(
              "app/src/main/java/com/marbleng/app/ui/theme/MarbleColor.kt"
          ).read_text(encoding="utf-8")

          marble_components = Path(
              "app/src/main/java/com/marbleng/app/ui/MarbleComponents.kt"
          ).read_text(encoding="utf-8")

          marble_app = Path(
              "app/src/main/java/com/marbleng/app/ui/MarbleApp.kt"
          ).read_text(encoding="utf-8")

          servers = Path(
              "app/src/main/java/com/marbleng/app/ui/ServersScreen.kt"
          ).read_text(encoding="utf-8")

          settings = Path(
              "app/src/main/java/com/marbleng/app/ui/SettingsScreen.kt"
          ).read_text(encoding="utf-8")

          repo = Path(
              "app/src/main/java/com/marbleng/app/AppRepository.kt"
          ).read_text(encoding="utf-8")

          vpn = Path(
              "app/src/main/java/com/marbleng/app/vpn/MarbleVpnService.kt"
          ).read_text(encoding="utf-8")

          manifest = Path(
              "app/src/main/AndroidManifest.xml"
          ).read_text(encoding="utf-8")

          required = {
              "expressive theme entry": "fun MarbleExpressiveTheme(" in marble_theme,
              "expressive motion scheme": "MotionScheme.expressive()" in marble_theme,
              "dynamic fallback schemes": (
                  "fun marbleFallbackLightScheme(" in marble_color
                  and "fun marbleFallbackDarkScheme(" in marble_color
              ),
              "1dp divider token": "DIVIDER_THICKNESS_DP: Int = 1" in marble_theme,
              "RTL list row": (
                  "fun MarbleListItem(" in marble_components
                  and "MarbleGlyph.CHEVRON_LEFT" in marble_components
              ),
              "MarbleApp modular tabs": (
                  "HomeScreen(" in marble_app
                  and "ServersScreen(" in marble_app
                  and "CustomSlotScreen(" in marble_app
                  and "SettingsScreen(" in marble_app
              ),
              "source-aware deletion": (
                  "removeProfile(profile.id, profile.subscriptionId)" in servers
              ),
              "modular settings navigation": (
                  "enum class SettingsDestination" in settings
                  and "SettingsConnectionModePage(" in settings
                  and "SettingsDiagnosticsPage(" in settings
              ),
              "live-score model": "calculateLiveRouteScore" in repo,
              "live sample count": "liveRouteSamples" in repo,
              "immediate active probe": (
                  "The dashboard should become meaningful as soon as Xray is live"
                  in vpn
              ),
              "platform back gesture": 'enableOnBackInvokedCallback="true"' in manifest,
          }

          failed = [
              name
              for name, passed in required.items()
              if not passed
          ]

          if failed:
              raise SystemExit(
                  "Product UI invariant failure: " + ", ".join(failed)
              )

          print("[OK] Marble M3 Expressive Product UI invariants")
          PY

      - name: Verify release publishing safety
        shell: bash
        run: |
          set -euo pipefail
          # MARBLE_RELEASE_PUBLISH_VERIFY_V182
          python3 - <<'PY'
          from pathlib import Path

          build = Path(
              ".github/workflows/build.yml"
          ).read_text(encoding="utf-8")

          required = {
              "resilient marker": (
                  "MARBLE_RELEASE_PUBLISH_RESILIENT_V182" in build
              ),
              "notes JSON": '--rawfile body "$notes_file"' in build,
              "target JSON": (
                  '--arg target "$GITHUB_SHA"' in build
                  and "target_commitish:$target" in build
              ),
              "assets": '"${assets[@]}"' in build,
              "tag guard": (
                  'git rev-parse -q --verify "refs/tags/$tag"' in build
              ),
              "release guard": (
                  'gh release view "v$v"' in build
              ),
              "no tag push": 'git push origin "$tag"' not in build,
              "no inline notes": (
                  '--notes "## MarbleNG $VERSION_NAME' not in build
              ),
          }

          failed = [
              name
              for name, passed in required.items()
              if not passed
          ]

          if failed:
              raise SystemExit(
                  "Release publishing safety invariant failure: "
                  + ", ".join(failed)
              )

          print("[OK] Release publisher is quote-safe and tag-atomic")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # MARBLE_SOCKET_FLIGHT_V168 CI unblock: Google retired the legacy
          # 'tools' SDK package (2026-09); the action defaults to
          # 'tools platform-tools' and sdkmanager exits 1 on the missing
          # package. platform-tools still exists; the later step installs
          # the platform/build-tools this build needs.
          packages: "platform-tools"

      - name: Install compile SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Read the pinned Gradle version
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^gradle=//p' gradle/toolchain.properties | tail -n 1)"
          echo "gradle=${version:-9.5.1}" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.toolchain.outputs.gradle }}

      - name: Unit tests and Kotlin compilation
        shell: bash
        # MARBLE_TOOLCHAIN_AUTOPILOT_V211 — the compiler is the only thing that can prove a
        # toolchain bump, so its output is kept and published where a human (or the branch that
        # is editing this file) can read it without a log download.
        run: |
          set -o pipefail
          gradle --no-daemon \
            :app:testDebugUnitTest \
            :app:compileDebugKotlin \
            :app:compileReleaseKotlin 2>&1 | tee gradle-ci.log

      - name: Publish what failed where a reader can see it
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          {
            echo "### Source verification failed"
            echo
            echo "\`${{ github.sha }}\` · run [#${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            if [ -s integrity.log ]; then
              echo "**Invariants**"
              echo
              echo '```'
              grep -E '^\[FAIL\]|^checks=|^Failed invariants|^ - ' integrity.log | tail -n 40 || true
              echo '```'
              echo
            fi
            if [ -s gradle-ci.log ]; then
              echo "**Compiler / tests**"
              echo
              echo '```'
              grep -E "^(e: |w: .*error)|FAILED|Execution failed|Caused by|^> |error:" gradle-ci.log | tail -n 80 || true
              echo '```'
              echo
              echo '<details><summary>last 60 lines of the Gradle output</summary>'
              echo
              echo '```'
              tail -n 60 gradle-ci.log
              echo '```'
              echo '</details>'
            fi
          } > "$body"
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "${{ github.head_ref }}" --json number --jq '.[0].number' || true)"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            echo "no pull request for this ref"
            tail -n 120 "$body"
          fi
