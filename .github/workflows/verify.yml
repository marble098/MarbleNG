name: Source verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marbleng-source-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/*.sh

      - name: Validate core lock
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.xray.tag and .hev.tag' core-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Compile Kotlin source
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugKotlin
