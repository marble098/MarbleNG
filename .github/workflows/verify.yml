name: Source verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marbleng-source-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/*.sh

      - name: Validate core lock
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.xray.tag and .hev.tag' core-lock.json

      - name: Reject malformed Compose function types
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          bad=[]
          pattern=re.compile(r':\s*@Composable\(\)\s*->')
          for path in Path('app/src/main/java').rglob('*.kt'):
              data=path.read_text(encoding='utf-8')
              if pattern.search(data):
                  bad.append(str(path))
          if bad:
              raise SystemExit('Malformed @Composable function type: ' + ', '.join(bad))
          PY

      - name: Verify routing source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          models=Path('app/src/main/java/com/marbleng/app/model/Models.kt').read_text()
          hardener=Path('app/src/main/java/com/marbleng/app/core/XrayConfigHardener.kt').read_text()
          identity=Path('app/src/main/java/com/marbleng/app/core/IdentityGuard.kt').read_text()
          build=Path('.github/workflows/build.yml').read_text()
          required={
              'geoip source':'Iran-v2ray-rules/release/geoip.dat' in models,
              'geosite source':'Iran-v2ray-rules/release/geosite.dat' in models,
              'geo direct default':'RoutingMode.GEO_DIRECT' in models,
              'ads default':'val routeBlockAds: Boolean = true' in models,
              'IPIfNonMatch':'IPIfNonMatch' in models,
              'normalized ad tag':'normalizeGeoSiteTag(settings.routeAdsTag)' in hardener,
              'proxy fallback':'Unmatched routing fallback must stay on the selected proxy' in hardener,
              'bounded identity direct':'RoutingDefaults.GEOSITE_DIRECT_TAGS' in identity,
              'bundled routing assets':'Bundle verified Iran routing assets' in build,
          }
          failed=[k for k,v in required.items() if not v]
          if failed:
              raise SystemExit('Routing invariant failure: ' + ', '.join(failed))
          PY

      - name: Verify Product UI v9 invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          ui=Path('app/src/main/java/com/marbleng/app/ui/Aether2026.kt').read_text()
          theme=Path('app/src/main/java/com/marbleng/app/ui/AetherTheme.kt').read_text()
          repo=Path('app/src/main/java/com/marbleng/app/AppRepository.kt').read_text()
          dock=ui[ui.find('private fun FloatingSpatialDock'):ui.find('private fun SpatialHeader')]
          required={
              'v9 marker':'Marble Product UI v9.0.0' in ui,
              'five-item dock':'onTheme' not in dock and 'isLight' not in dock,
              'short nav label':'LAB("Quality", "◔")' in ui,
              'page motion':'marble-page-transition' in ui and 'slideInHorizontally' in ui,
              'appearance in settings':'"Appearance"' in ui,
              'animated score ring':'score-ring-progress' in ui,
              'race score floor removed':'maxOf(80.0, raced.second.score)' not in repo,
              'theme v9':'Marble Product UI v9' in theme,
          }
          failed=[k for k,v in required.items() if not v]
          if failed:
              raise SystemExit('Product UI v9 invariant failure: '+', '.join(failed))
          print('[OK] Product UI v9 source invariants')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Compile Kotlin source
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugKotlin :app:compileReleaseKotlin
