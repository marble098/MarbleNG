name: Build signed Android APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marbleng-release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Xray's own go.mod decides the actual Go toolchain.
  GOTOOLCHAIN: auto

jobs:
  build:
    name: Build signed MarbleNG APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ========================================================================
      # Checkout
      # ========================================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ========================================================================
      # Java
      # ========================================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ========================================================================
      # Android SDK
      # ========================================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358'

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" \
            >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" \
            >> "$GITHUB_ENV"

      # ========================================================================
      # Determine Go version directly from pinned Xray
      # ========================================================================

      - name: Clone pinned Xray metadata
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .bootstrap
          mkdir -p .bootstrap

          XRAY_TAG="$(jq -r '.xray.tag' core-lock.json)"

          test -n "$XRAY_TAG"
          test "$XRAY_TAG" != "null"

          echo "Pinned Xray: $XRAY_TAG"

          git clone \
            --quiet \
            --depth 1 \
            --branch "$XRAY_TAG" \
            https://github.com/XTLS/Xray-core.git \
            .bootstrap/xray

          test -s .bootstrap/xray/go.mod

          echo "Xray Go requirement:"
          grep '^go ' .bootstrap/xray/go.mod

      - name: Set up Xray Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: .bootstrap/xray/go.mod
          cache: true

      - name: Verify Go environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Bootstrap Go:"
          go version

          echo
          echo "GOTOOLCHAIN:"
          echo "$GOTOOLCHAIN"

          echo
          echo "Pinned Xray go.mod:"
          grep '^go ' .bootstrap/xray/go.mod

      # ========================================================================
      # Native Xray + HEV + JNI
      # ========================================================================

      - name: Prepare all native ABIs
        shell: bash
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail

          chmod +x scripts/prepare-native.sh
          ./scripts/prepare-native.sh

      # ========================================================================
      # Verified routing data bundled into the APK
      # ========================================================================

      - name: Bundle verified Iran routing assets
        shell: bash
        run: |
          set -euo pipefail

          DEST="app/src/main/assets/xray"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$DEST"

          fetch_one() {
            local output="$1"
            shift
            local tmp="$TMP/$(basename "$output").part"
            rm -f "$tmp"
            for url in "$@"; do
              echo "Fetching $url"
              if curl --fail --location --silent --show-error \
                  --retry 4 --retry-delay 2 --retry-all-errors \
                  --connect-timeout 15 --max-time 240 \
                  --output "$tmp" "$url"; then
                test -s "$tmp"
                mv -f "$tmp" "$output"
                return 0
              fi
              rm -f "$tmp"
            done
            return 1
          }

          fetch_one "$DEST/geoip.dat" \
            "https://raw.githubusercontent.com/Chocolate4U/Iran-v2ray-rules/release/geoip.dat" \
            "https://cdn.jsdelivr.net/gh/chocolate4u/Iran-v2ray-rules@release/geoip.dat"
          fetch_one "$TMP/geoip.sha256" \
            "https://raw.githubusercontent.com/Chocolate4U/Iran-v2ray-rules/release/geoip.dat.sha256sum" \
            "https://cdn.jsdelivr.net/gh/chocolate4u/Iran-v2ray-rules@release/geoip.dat.sha256sum"

          fetch_one "$DEST/geosite.dat" \
            "https://raw.githubusercontent.com/Chocolate4U/Iran-v2ray-rules/release/geosite.dat" \
            "https://cdn.jsdelivr.net/gh/chocolate4u/Iran-v2ray-rules@release/geosite.dat"
          fetch_one "$TMP/geosite.sha256" \
            "https://raw.githubusercontent.com/Chocolate4U/Iran-v2ray-rules/release/geosite.dat.sha256sum" \
            "https://cdn.jsdelivr.net/gh/chocolate4u/Iran-v2ray-rules@release/geosite.dat.sha256sum"

          expected_geoip="$(awk 'NF {print $1; exit}' "$TMP/geoip.sha256")"
          expected_geosite="$(awk 'NF {print $1; exit}' "$TMP/geosite.sha256")"
          actual_geoip="$(sha256sum "$DEST/geoip.dat" | awk '{print $1}')"
          actual_geosite="$(sha256sum "$DEST/geosite.dat" | awk '{print $1}')"

          test -n "$expected_geoip"
          test -n "$expected_geosite"
          test "$actual_geoip" = "$expected_geoip"
          test "$actual_geosite" = "$expected_geosite"
          test "$(stat -c '%s' "$DEST/geoip.dat")" -gt 1024
          test "$(stat -c '%s' "$DEST/geosite.dat")" -gt 1024

          echo "[OK] geoip.dat   $actual_geoip"
          echo "[OK] geosite.dat $actual_geosite"

      # ========================================================================
      # Gradle
      # ========================================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      # ========================================================================
      # Restore + validate signing identity
      #
      # Important:
      # Old MarbleNG injectors generated a PKCS12 keystore while supplying
      # different store/key passwords. Modern keytool may ignore the separate
      # key password for PKCS12 and protect the private key using store password.
      #
      # Therefore:
      #   1. First try ANDROID_KEY_PASSWORD.
      #   2. If it cannot decrypt the key, try ANDROID_KEYSTORE_PASSWORD.
      #   3. Never generate a new key here.
      #
      # This preserves the SAME signing identity.
      # ========================================================================

      - name: Restore and validate stable release signer
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$*"
            exit 1
          }

          # --------------------------------------------------------------------
          # Ensure every required secret exists.
          # --------------------------------------------------------------------

          test -n "${KS_B64:-}" || fail "ANDROID_KEYSTORE_B64 is missing."
          test -n "${KS_PASS:-}" || fail "ANDROID_KEYSTORE_PASSWORD is missing."
          test -n "${KS_ALIAS:-}" || fail "ANDROID_KEY_ALIAS is missing."
          test -n "${KEY_PASS:-}" || fail "ANDROID_KEY_PASSWORD is missing."

          # --------------------------------------------------------------------
          # Restore keystore exactly as stored.
          # --------------------------------------------------------------------

          rm -f release.jks signing.properties

          printf '%s' "$KS_B64" |
            base64 --decode > release.jks

          chmod 600 release.jks

          test -s release.jks ||
            fail "Decoded release keystore is empty."

          # --------------------------------------------------------------------
          # Validate store password and alias before spending minutes building.
          # --------------------------------------------------------------------

          if ! keytool \
              -list \
              -keystore release.jks \
              -storepass "$KS_PASS" \
              -alias "$KS_ALIAS" \
              >/dev/null 2>&1
          then
            fail "Keystore/store password/alias validation failed."
          fi

          echo "[OK] Keystore container and alias are valid."

          # --------------------------------------------------------------------
          # Java verifier.
          #
          # Unlike keytool's PKCS12 compatibility behavior, KeyStore.getKey()
          # verifies the actual password Gradle will use for the private key.
          # --------------------------------------------------------------------

          cat > "$RUNNER_TEMP/VerifyMarbleNGKey.java" <<'JAVA'
          import java.io.File;
          import java.security.Key;
          import java.security.KeyStore;

          public final class VerifyMarbleNGKey {
              public static void main(String[] args) throws Exception {
                  if (args.length != 4) {
                      throw new IllegalArgumentException(
                          "Expected: <keystore> <storePass> <alias> <keyPass>"
                      );
                  }

                  File file = new File(args[0]);

                  KeyStore store = KeyStore.getInstance(
                      file,
                      args[1].toCharArray()
                  );

                  if (!store.containsAlias(args[2])) {
                      throw new IllegalStateException(
                          "Signing alias does not exist"
                      );
                  }

                  Key key = store.getKey(
                      args[2],
                      args[3].toCharArray()
                  );

                  if (key == null) {
                      throw new IllegalStateException(
                          "Private signing key could not be loaded"
                      );
                  }
              }
          }
          JAVA

          verify_key_password() {
            java \
              "$RUNNER_TEMP/VerifyMarbleNGKey.java" \
              "$PWD/release.jks" \
              "$KS_PASS" \
              "$KS_ALIAS" \
              "$1" \
              >/dev/null 2>&1
          }

          EFFECTIVE_KEY_PASS=""

          # --------------------------------------------------------------------
          # Normal/new signing configuration.
          # --------------------------------------------------------------------

          if verify_key_password "$KEY_PASS"; then

            EFFECTIVE_KEY_PASS="$KEY_PASS"

            echo "[OK] Private key password validated."

          # --------------------------------------------------------------------
          # Compatibility recovery for the OLD injector.
          #
          # This is expected for existing MarbleNG PKCS12 stores created with
          # two generated passwords where keytool ignored the second password.
          #
          # No key is regenerated.
          # No certificate changes.
          # APK signing identity stays identical.
          # --------------------------------------------------------------------

          elif verify_key_password "$KS_PASS"; then

            EFFECTIVE_KEY_PASS="$KS_PASS"

            echo "::warning::Legacy MarbleNG PKCS12 password mismatch detected."
            echo "::warning::Using the store password as the effective private-key password."
            echo "[OK] Existing signing identity recovered without key rotation."

          else

            fail "Private signing key cannot be decrypted with either configured password. Do NOT regenerate the keystore if preserving the app signature matters."

          fi

          # --------------------------------------------------------------------
          # Create Gradle signing file.
          #
          # Keep secret contents out of logs.
          # --------------------------------------------------------------------

          {
            printf 'storeFile=release.jks\n'
            printf 'storePassword=%s\n' "$KS_PASS"
            printf 'keyAlias=%s\n' "$KS_ALIAS"
            printf 'keyPassword=%s\n' "$EFFECTIVE_KEY_PASS"
          } > signing.properties

          chmod 600 signing.properties

          # --------------------------------------------------------------------
          # Final verification using values just written for Gradle.
          # --------------------------------------------------------------------

          if ! verify_key_password "$EFFECTIVE_KEY_PASS"; then
            fail "Final signing verification unexpectedly failed."
          fi

          echo "[OK] Release signing identity is ready."

          # Certificate details are safe; passwords/private key are not printed.
          echo
          echo "Signing certificate:"
          keytool \
            -list \
            -v \
            -keystore release.jks \
            -storepass "$KS_PASS" \
            -alias "$KS_ALIAS" |
            grep -E 'Alias name:|Owner:|Issuer:|SHA256:' |
            head -n 8 || true

      # ========================================================================
      # Version
      # ========================================================================

      - name: Generate smart semantic version
        shell: bash
        run: |
          set -euo pipefail
          # MARBLE_SEMVER_AUTOBUMP_V36

          LAST_TAG="$(
            git tag --list |
              awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' |
              sort -V |
              tail -n 1
          )"
          LAST_VERSION="${LAST_TAG#v}"

          version_lt() {
            local a="$1" b="$2"
            [[ "$a" != "$b" ]] &&
              [[ "$(printf '%s\n%s\n' "$a" "$b" | sort -V | head -n1)" == "$a" ]]
          }

          normalize_policy() {
            local major="$1" minor="$2" patch="$3"
            if (( minor >= 9 )); then
              major=$((major + 1))
              minor=0
              patch=0
            fi
            printf '%d.%d.%d\n' "$major" "$minor" "$patch"
          }

          bump_patch() {
            local version="$1" steps="$2"
            local major minor patch i
            IFS=. read -r major minor patch <<< "$version"
            for ((i=0; i<steps; i++)); do
              patch=$((patch + 1))
              if (( patch > 9 )); then
                patch=0
                minor=$((minor + 1))
              fi
              if (( minor >= 9 )); then
                major=$((major + 1))
                minor=0
                patch=0
              fi
            done
            normalize_policy "$major" "$minor" "$patch"
          }

          bump_minor() {
            local major minor patch
            IFS=. read -r major minor patch <<< "$1"
            minor=$((minor + 1))
            normalize_policy "$major" "$minor" 0
          }

          bump_major() {
            local major minor patch
            IFS=. read -r major minor patch <<< "$1"
            printf '%d.0.0\n' "$((major + 1))"
          }

          if [[ -z "$LAST_VERSION" ]] || version_lt "$LAST_VERSION" "1.0.2"; then
            VERSION_NAME="1.0.2"
            VERSION_BUMP_KIND="bootstrap"
            VERSION_CHANGE_FILES=0
            VERSION_CHANGE_LINES=0
          else
            HEAD_MESSAGE="$(git log -1 --pretty=%B "$GITHUB_SHA")"
            # MARBLE_SEMVER_RANGE_FIX_V361
            # Three-dot syntax is one rev-range token: <tag>...<sha>.
            # Splitting after `...` makes git diff exit 129.
            if ! git rev-parse --verify --quiet "${LAST_TAG}^{commit}" >/dev/null; then
              echo "::error::Semantic release base $LAST_TAG is not a valid commit tag."
              exit 1
            fi

            if ! git rev-parse --verify --quiet "${GITHUB_SHA}^{commit}" >/dev/null; then
              echo "::error::Workflow commit $GITHUB_SHA is not available in checkout."
              exit 1
            fi

            VERSION_RANGE="${LAST_TAG}...${GITHUB_SHA}"

            # Validate the merge-base/range before using it for change-volume policy.
            if ! git merge-base "$LAST_TAG" "$GITHUB_SHA" >/dev/null 2>&1; then
              echo "::error::No merge base between $LAST_TAG and $GITHUB_SHA."
              exit 1
            fi

            VERSION_CHANGE_FILES="$(
              git diff --name-only "$VERSION_RANGE" -- |
                awk 'NF' |
                wc -l |
                tr -d ' '
            )"
            VERSION_CHANGE_LINES="$(
              git diff --numstat "$VERSION_RANGE" -- |
                awk '
                  $1 ~ /^[0-9]+$/ { a += $1 }
                  $2 ~ /^[0-9]+$/ { d += $2 }
                  END { print a + d + 0 }
                '
            )"

            VERSION_BUMP_KIND=""
            PATCH_STEPS=0

            if grep -Eqi '\[version:major\]' <<< "$HEAD_MESSAGE"; then
              VERSION_BUMP_KIND="major"
            elif grep -Eqi '\[version:minor\]' <<< "$HEAD_MESSAGE"; then
              VERSION_BUMP_KIND="minor"
            elif grep -Eqi '\[version:patch\+[1-8]\]' <<< "$HEAD_MESSAGE"; then
              VERSION_BUMP_KIND="patch"
              PATCH_STEPS="$(sed -nE 's/.*\[version:patch\+([1-8])\].*/\1/ip' <<< "$HEAD_MESSAGE" | head -n1)"
            elif grep -Eqi '\[version:patch\]' <<< "$HEAD_MESSAGE"; then
              VERSION_BUMP_KIND="patch"
              PATCH_STEPS=1
            fi

            if [[ -z "$VERSION_BUMP_KIND" ]]; then
              if (( VERSION_CHANGE_FILES >= 25 || VERSION_CHANGE_LINES >= 3000 )); then
                VERSION_BUMP_KIND="major"
              elif (( VERSION_CHANGE_FILES >= 12 || VERSION_CHANGE_LINES >= 1000 )); then
                VERSION_BUMP_KIND="minor"
              elif (( VERSION_CHANGE_FILES >= 6 || VERSION_CHANGE_LINES >= 300 )); then
                VERSION_BUMP_KIND="patch"
                PATCH_STEPS=2
              else
                VERSION_BUMP_KIND="patch"
                PATCH_STEPS=1
              fi
            fi

            case "$VERSION_BUMP_KIND" in
              major) VERSION_NAME="$(bump_major "$LAST_VERSION")" ;;
              minor) VERSION_NAME="$(bump_minor "$LAST_VERSION")" ;;
              patch) VERSION_NAME="$(bump_patch "$LAST_VERSION" "${PATCH_STEPS:-1}")" ;;
              *) echo "::error::Unknown version bump class"; exit 1 ;;
            esac
          fi

          VERSION_CODE="$(date -u +%s)"

          if (( VERSION_CODE <= 0 || VERSION_CODE > 2100000000 )); then
            echo "::error::Android versionCode is outside accepted range: $VERSION_CODE"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$VERSION_NAME" >/dev/null; then
            echo "::error::Refusing to overwrite existing tag v$VERSION_NAME"
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_BUMP_KIND=$VERSION_BUMP_KIND" >> "$GITHUB_ENV"
          echo "VERSION_CHANGE_FILES=${VERSION_CHANGE_FILES:-0}" >> "$GITHUB_ENV"
          echo "VERSION_CHANGE_LINES=${VERSION_CHANGE_LINES:-0}" >> "$GITHUB_ENV"

          echo "Previous semantic release: ${LAST_VERSION:-legacy/none}"
          if [[ -n "${LAST_TAG:-}" ]]; then
            echo "Version diff range: ${VERSION_RANGE:-bootstrap}"
          fi
          echo "Version bump: $VERSION_BUMP_KIND"
          echo "Changed files: ${VERSION_CHANGE_FILES:-0}"
          echo "Changed lines: ${VERSION_CHANGE_LINES:-0}"
          echo "Version name: $VERSION_NAME"
          echo "Android versionCode: $VERSION_CODE"

      # ========================================================================
      # Android release
      # ========================================================================

      - name: Build signed release APKs
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            clean \
            assembleRelease \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE"

      # ========================================================================
      # Collect APKs
      # ========================================================================

      - name: Collect and verify APKs
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          count=0

          while IFS= read -r -d '' apk; do

            original="$(basename "$apk")"

            output="dist/MarbleNG-${VERSION_NAME}-${original#app-}"

            cp -f "$apk" "$output"

            count=$((count + 1))

          done < <(
            find \
              app/build/outputs/apk/release \
              -type f \
              -name '*.apk' \
              -print0
          )

          if (( count == 0 )); then
            echo "::error::No release APK was produced."
            exit 1
          fi

          echo "Collected $count APK(s)."

          (
            cd dist
            sha256sum *.apk > SHA256SUMS.txt
          )

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          test -x "$APKSIGNER"

          : > dist/SIGNING-CERTS.txt

          for apk in dist/*.apk; do

            echo "Verifying $(basename "$apk")"

            "$APKSIGNER" \
              verify \
              --verbose \
              --print-certs \
              "$apk" \
              >> dist/SIGNING-CERTS.txt

            echo \
              "===== $(basename "$apk") =====" \
              >> dist/SIGNING-CERTS.txt

          done

          ls -lh dist

      # ========================================================================
      # Artifact
      # ========================================================================

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MarbleNG-${{ env.VERSION_NAME }}-all-architectures
          path: dist/*
          if-no-files-found: error

      # ========================================================================
      # GitHub Release
      # ========================================================================

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="v$VERSION_NAME"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; refusing to replace an installed build."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists; refusing to move it."
            exit 1
          fi

          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"

          XRAY_VERSION="$(jq -r '.xray.tag' core-lock.json)"
          HEV_VERSION="$(jq -r '.hev.tag' core-lock.json)"

          gh release create \
            "$tag" \
            dist/* \
            --title "MarbleNG $VERSION_NAME" \
            --notes "## MarbleNG $VERSION_NAME

          ### Home UI
          - Rebuilt Home around a consistent modern vector-icon language.
          - Removed font-dependent Unicode action glyphs, including the broken power symbol.
          - Added vector icons to branding, connection state, tunnel mode, connect controls, route inspection, Ping, Jitter, Quality, summary metrics, benchmark, Iran Mode, Quick Actions and network traffic.
          - Rank, Library, Privacy and Routing portals now use matching Canvas vectors.
          - Upload/download and Home status chips are font-independent.

          ### UX & persistence
          - Always persist the last successfully connected node for exact one-tap Home reconnect after app restart.
          - Home prioritizes that exact remembered profile before automatic candidate selection.
          - Library and Settings now use the same clean fixed-height title treatment as Home.
          - Removed the oversized Library SOURCE SPACE summary and redundant visual counters while preserving source, sort, refresh, ping and rank controls.
          - Clipboard import moved under Add instead of permanently occupying the search row.
          - Removed decorative accordion category badges.
          - Removed the heavy black shadow below in-app Snackbar notifications.
          - Replaced remaining Library/Snackbar action glyphs with font-independent Canvas vectors.
          - README.md was fully refreshed for the current app.

          ### Release system
          - Replaced fixed 1.0.2 publishing with automatic semantic releases.
          - Version jumps can follow change volume or explicit [version:*] commit hints.
          - Android versionCode remains epoch-based and monotonic.
          - Existing release tags are immutable.

          ### Version metadata
          - Bump class: $VERSION_BUMP_KIND
          - Changed files: $VERSION_CHANGE_FILES
          - Changed lines: $VERSION_CHANGE_LINES
          - Android versionCode: $VERSION_CODE

          ### Native cores
          - Xray: $XRAY_VERSION
          - HEV SOCKS5 Tunnel: $HEV_VERSION

          APKs are signed with the persistent MarbleNG Android signing identity stored in repository secrets."
