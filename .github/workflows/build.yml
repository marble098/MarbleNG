name: Build signed Android APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marbleng-release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Xray's own go.mod decides the actual Go toolchain.
  GOTOOLCHAIN: auto

jobs:
  build:
    name: Build signed MarbleNG APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ========================================================================
      # Checkout
      # ========================================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Marble system integrity preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/system-integrity-check.py

      # ========================================================================
      # Java
      # ========================================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ========================================================================
      # Android SDK
      # ========================================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358'

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" \
            >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" \
            >> "$GITHUB_ENV"

      # ========================================================================
      # Determine Go version directly from pinned Xray
      # ========================================================================

      - name: Clone pinned Xray metadata
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .bootstrap
          mkdir -p .bootstrap

          XRAY_TAG="$(jq -r '.xray.tag' core-lock.json)"

          test -n "$XRAY_TAG"
          test "$XRAY_TAG" != "null"

          echo "Pinned Xray: $XRAY_TAG"

          git clone \
            --quiet \
            --depth 1 \
            --branch "$XRAY_TAG" \
            https://github.com/XTLS/Xray-core.git \
            .bootstrap/xray

          test -s .bootstrap/xray/go.mod

          echo "Xray Go requirement:"
          grep '^go ' .bootstrap/xray/go.mod

      - name: Set up Xray Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: .bootstrap/xray/go.mod
          cache: true

      - name: Verify Go environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Bootstrap Go:"
          go version

          echo
          echo "GOTOOLCHAIN:"
          echo "$GOTOOLCHAIN"

          echo
          echo "Pinned Xray go.mod:"
          grep '^go ' .bootstrap/xray/go.mod

      # ========================================================================
      # Native Xray + HEV + JNI
      # ========================================================================

      - name: Prepare all native ABIs
        shell: bash
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail

          chmod +x scripts/prepare-native.sh
          ./scripts/prepare-native.sh

      # ========================================================================
      # Verified routing data bundled into the APK
      # ========================================================================

      - name: Bundle verified Iran routing assets
        shell: bash
        run: |
          set -euo pipefail

          DEST="app/src/main/assets/xray"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$DEST"

          fetch_one() {
            local output="$1"
            shift
            local tmp="$TMP/$(basename "$output").part"
            rm -f "$tmp"
            for url in "$@"; do
              echo "Fetching $url"
              if curl --fail --location --silent --show-error \
                  --retry 4 --retry-delay 2 --retry-all-errors \
                  --connect-timeout 15 --max-time 240 \
                  --output "$tmp" "$url"; then
                test -s "$tmp"
                mv -f "$tmp" "$output"
                return 0
              fi
              rm -f "$tmp"
            done
            return 1
          }

          fetch_one "$DEST/geoip.dat" \
            "https://raw.githubusercontent.com/Chocolate4U/Iran-v2ray-rules/release/geoip.dat" \
            "https://cdn.jsdelivr.net/gh/chocolate4u/Iran-v2ray-rules@release/geoip.dat"
          fetch_one "$TMP/geoip.sha256" \
            "https://raw.githubusercontent.com/Chocolate4U/Iran-v2ray-rules/release/geoip.dat.sha256sum" \
            "https://cdn.jsdelivr.net/gh/chocolate4u/Iran-v2ray-rules@release/geoip.dat.sha256sum"

          fetch_one "$DEST/geosite.dat" \
            "https://raw.githubusercontent.com/Chocolate4U/Iran-v2ray-rules/release/geosite.dat" \
            "https://cdn.jsdelivr.net/gh/chocolate4u/Iran-v2ray-rules@release/geosite.dat"
          fetch_one "$TMP/geosite.sha256" \
            "https://raw.githubusercontent.com/Chocolate4U/Iran-v2ray-rules/release/geosite.dat.sha256sum" \
            "https://cdn.jsdelivr.net/gh/chocolate4u/Iran-v2ray-rules@release/geosite.dat.sha256sum"

          expected_geoip="$(awk 'NF {print $1; exit}' "$TMP/geoip.sha256")"
          expected_geosite="$(awk 'NF {print $1; exit}' "$TMP/geosite.sha256")"
          actual_geoip="$(sha256sum "$DEST/geoip.dat" | awk '{print $1}')"
          actual_geosite="$(sha256sum "$DEST/geosite.dat" | awk '{print $1}')"

          test -n "$expected_geoip"
          test -n "$expected_geosite"
          test "$actual_geoip" = "$expected_geoip"
          test "$actual_geosite" = "$expected_geosite"
          test "$(stat -c '%s' "$DEST/geoip.dat")" -gt 1024
          test "$(stat -c '%s' "$DEST/geosite.dat")" -gt 1024

          echo "[OK] geoip.dat   $actual_geoip"
          echo "[OK] geosite.dat $actual_geosite"

      # ========================================================================
      # Gradle
      # ========================================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      # ========================================================================
      # Restore + validate signing identity
      #
      # Important:
      # Old MarbleNG injectors generated a PKCS12 keystore while supplying
      # different store/key passwords. Modern keytool may ignore the separate
      # key password for PKCS12 and protect the private key using store password.
      #
      # Therefore:
      #   1. First try ANDROID_KEY_PASSWORD.
      #   2. If it cannot decrypt the key, try ANDROID_KEYSTORE_PASSWORD.
      #   3. Never generate a new key here.
      #
      # This preserves the SAME signing identity.
      # ========================================================================

      - name: Restore and validate stable release signer
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$*"
            exit 1
          }

          # --------------------------------------------------------------------
          # Ensure every required secret exists.
          # --------------------------------------------------------------------

          test -n "${KS_B64:-}" || fail "ANDROID_KEYSTORE_B64 is missing."
          test -n "${KS_PASS:-}" || fail "ANDROID_KEYSTORE_PASSWORD is missing."
          test -n "${KS_ALIAS:-}" || fail "ANDROID_KEY_ALIAS is missing."
          test -n "${KEY_PASS:-}" || fail "ANDROID_KEY_PASSWORD is missing."

          # --------------------------------------------------------------------
          # Restore keystore exactly as stored.
          # --------------------------------------------------------------------

          rm -f release.jks signing.properties

          printf '%s' "$KS_B64" |
            base64 --decode > release.jks

          chmod 600 release.jks

          test -s release.jks ||
            fail "Decoded release keystore is empty."

          # --------------------------------------------------------------------
          # Validate store password and alias before spending minutes building.
          # --------------------------------------------------------------------

          if ! keytool \
              -list \
              -keystore release.jks \
              -storepass "$KS_PASS" \
              -alias "$KS_ALIAS" \
              >/dev/null 2>&1
          then
            fail "Keystore/store password/alias validation failed."
          fi

          echo "[OK] Keystore container and alias are valid."

          # --------------------------------------------------------------------
          # Java verifier.
          #
          # Unlike keytool's PKCS12 compatibility behavior, KeyStore.getKey()
          # verifies the actual password Gradle will use for the private key.
          # --------------------------------------------------------------------

          cat > "$RUNNER_TEMP/VerifyMarbleNGKey.java" <<'JAVA'
          import java.io.File;
          import java.security.Key;
          import java.security.KeyStore;

          public final class VerifyMarbleNGKey {
              public static void main(String[] args) throws Exception {
                  if (args.length != 4) {
                      throw new IllegalArgumentException(
                          "Expected: <keystore> <storePass> <alias> <keyPass>"
                      );
                  }

                  File file = new File(args[0]);

                  KeyStore store = KeyStore.getInstance(
                      file,
                      args[1].toCharArray()
                  );

                  if (!store.containsAlias(args[2])) {
                      throw new IllegalStateException(
                          "Signing alias does not exist"
                      );
                  }

                  Key key = store.getKey(
                      args[2],
                      args[3].toCharArray()
                  );

                  if (key == null) {
                      throw new IllegalStateException(
                          "Private signing key could not be loaded"
                      );
                  }
              }
          }
          JAVA

          verify_key_password() {
            java \
              "$RUNNER_TEMP/VerifyMarbleNGKey.java" \
              "$PWD/release.jks" \
              "$KS_PASS" \
              "$KS_ALIAS" \
              "$1" \
              >/dev/null 2>&1
          }

          EFFECTIVE_KEY_PASS=""

          # --------------------------------------------------------------------
          # Normal/new signing configuration.
          # --------------------------------------------------------------------

          if verify_key_password "$KEY_PASS"; then

            EFFECTIVE_KEY_PASS="$KEY_PASS"

            echo "[OK] Private key password validated."

          # --------------------------------------------------------------------
          # Compatibility recovery for the OLD injector.
          #
          # This is expected for existing MarbleNG PKCS12 stores created with
          # two generated passwords where keytool ignored the second password.
          #
          # No key is regenerated.
          # No certificate changes.
          # APK signing identity stays identical.
          # --------------------------------------------------------------------

          elif verify_key_password "$KS_PASS"; then

            EFFECTIVE_KEY_PASS="$KS_PASS"

            echo "::warning::Legacy MarbleNG PKCS12 password mismatch detected."
            echo "::warning::Using the store password as the effective private-key password."
            echo "[OK] Existing signing identity recovered without key rotation."

          else

            fail "Private signing key cannot be decrypted with either configured password. Do NOT regenerate the keystore if preserving the app signature matters."

          fi

          # --------------------------------------------------------------------
          # Create Gradle signing file.
          #
          # Keep secret contents out of logs.
          # --------------------------------------------------------------------

          {
            printf 'storeFile=release.jks\n'
            printf 'storePassword=%s\n' "$KS_PASS"
            printf 'keyAlias=%s\n' "$KS_ALIAS"
            printf 'keyPassword=%s\n' "$EFFECTIVE_KEY_PASS"
          } > signing.properties

          chmod 600 signing.properties

          # --------------------------------------------------------------------
          # Final verification using values just written for Gradle.
          # --------------------------------------------------------------------

          if ! verify_key_password "$EFFECTIVE_KEY_PASS"; then
            fail "Final signing verification unexpectedly failed."
          fi

          echo "[OK] Release signing identity is ready."

          # Certificate details are safe; passwords/private key are not printed.
          echo
          echo "Signing certificate:"
          keytool \
            -list \
            -v \
            -keystore release.jks \
            -storepass "$KS_PASS" \
            -alias "$KS_ALIAS" |
            grep -E 'Alias name:|Owner:|Issuer:|SHA256:' |
            head -n 8 || true

      # ========================================================================
      # Version
      # ========================================================================

      - name: Generate smart semantic version
        shell: bash
        run: |
          set -euo pipefail
          # MARBLE_SEMVER_AUTOBUMP_V36

          LAST_TAG="$(
            git tag --list |
              awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' |
              sort -V |
              tail -n 1
          )"
          LAST_VERSION="${LAST_TAG#v}"

          version_lt() {
            local a="$1" b="$2"
            [[ "$a" != "$b" ]] &&
              [[ "$(printf '%s\n%s\n' "$a" "$b" | sort -V | head -n1)" == "$a" ]]
          }

          normalize_policy() {
            local major="$1" minor="$2" patch="$3"
            if (( minor >= 9 )); then
              major=$((major + 1))
              minor=0
              patch=0
            fi
            printf '%d.%d.%d\n' "$major" "$minor" "$patch"
          }

          bump_patch() {
            local version="$1" steps="$2"
            local major minor patch i
            IFS=. read -r major minor patch <<< "$version"
            for ((i=0; i<steps; i++)); do
              patch=$((patch + 1))
              if (( patch > 9 )); then
                patch=0
                minor=$((minor + 1))
              fi
              if (( minor >= 9 )); then
                major=$((major + 1))
                minor=0
                patch=0
              fi
            done
            normalize_policy "$major" "$minor" "$patch"
          }

          bump_minor() {
            local major minor patch
            IFS=. read -r major minor patch <<< "$1"
            minor=$((minor + 1))
            normalize_policy "$major" "$minor" 0
          }

          bump_major() {
            local major minor patch
            IFS=. read -r major minor patch <<< "$1"
            printf '%d.0.0\n' "$((major + 1))"
          }

          if [[ -z "$LAST_VERSION" ]] || version_lt "$LAST_VERSION" "1.0.2"; then
            VERSION_NAME="1.0.2"
            VERSION_BUMP_KIND="bootstrap"
            VERSION_CHANGE_FILES=0
            VERSION_CHANGE_LINES=0
          else
            HEAD_MESSAGE="$(git log -1 --pretty=%B "$GITHUB_SHA")"
            # MARBLE_SEMVER_RANGE_FIX_V361
            # Three-dot syntax is one rev-range token: <tag>...<sha>.
            # Splitting after `...` makes git diff exit 129.
            if ! git rev-parse --verify --quiet "${LAST_TAG}^{commit}" >/dev/null; then
              echo "::error::Semantic release base $LAST_TAG is not a valid commit tag."
              exit 1
            fi

            if ! git rev-parse --verify --quiet "${GITHUB_SHA}^{commit}" >/dev/null; then
              echo "::error::Workflow commit $GITHUB_SHA is not available in checkout."
              exit 1
            fi

            VERSION_RANGE="${LAST_TAG}...${GITHUB_SHA}"

            # Validate the merge-base/range before using it for change-volume policy.
            if ! git merge-base "$LAST_TAG" "$GITHUB_SHA" >/dev/null 2>&1; then
              echo "::error::No merge base between $LAST_TAG and $GITHUB_SHA."
              exit 1
            fi

            VERSION_CHANGE_FILES="$(
              git diff --name-only "$VERSION_RANGE" -- |
                awk 'NF' |
                wc -l |
                tr -d ' '
            )"
            VERSION_CHANGE_LINES="$(
              git diff --numstat "$VERSION_RANGE" -- |
                awk '
                  $1 ~ /^[0-9]+$/ { a += $1 }
                  $2 ~ /^[0-9]+$/ { d += $2 }
                  END { print a + d + 0 }
                '
            )"

            VERSION_BUMP_KIND=""
            PATCH_STEPS=0

            if grep -Eqi '\[version:major\]' <<< "$HEAD_MESSAGE"; then
              VERSION_BUMP_KIND="major"
            elif grep -Eqi '\[version:minor\]' <<< "$HEAD_MESSAGE"; then
              VERSION_BUMP_KIND="minor"
            elif grep -Eqi '\[version:patch\+[1-8]\]' <<< "$HEAD_MESSAGE"; then
              VERSION_BUMP_KIND="patch"
              PATCH_STEPS="$(sed -nE 's/.*\[version:patch\+([1-8])\].*/\1/ip' <<< "$HEAD_MESSAGE" | head -n1)"
            elif grep -Eqi '\[version:patch\]' <<< "$HEAD_MESSAGE"; then
              VERSION_BUMP_KIND="patch"
              PATCH_STEPS=1
            fi

            if [[ -z "$VERSION_BUMP_KIND" ]]; then
              if (( VERSION_CHANGE_FILES >= 25 || VERSION_CHANGE_LINES >= 3000 )); then
                VERSION_BUMP_KIND="major"
              elif (( VERSION_CHANGE_FILES >= 12 || VERSION_CHANGE_LINES >= 1000 )); then
                VERSION_BUMP_KIND="minor"
              elif (( VERSION_CHANGE_FILES >= 6 || VERSION_CHANGE_LINES >= 300 )); then
                VERSION_BUMP_KIND="patch"
                PATCH_STEPS=2
              else
                VERSION_BUMP_KIND="patch"
                PATCH_STEPS=1
              fi
            fi

            case "$VERSION_BUMP_KIND" in
              major) VERSION_NAME="$(bump_major "$LAST_VERSION")" ;;
              minor) VERSION_NAME="$(bump_minor "$LAST_VERSION")" ;;
              patch) VERSION_NAME="$(bump_patch "$LAST_VERSION" "${PATCH_STEPS:-1}")" ;;
              *) echo "::error::Unknown version bump class"; exit 1 ;;
            esac
          fi

          VERSION_CODE="$(date -u +%s)"

          if (( VERSION_CODE <= 0 || VERSION_CODE > 2100000000 )); then
            echo "::error::Android versionCode is outside accepted range: $VERSION_CODE"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$VERSION_NAME" >/dev/null; then
            echo "::error::Refusing to overwrite existing tag v$VERSION_NAME"
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_BUMP_KIND=$VERSION_BUMP_KIND" >> "$GITHUB_ENV"
          echo "VERSION_CHANGE_FILES=${VERSION_CHANGE_FILES:-0}" >> "$GITHUB_ENV"
          echo "VERSION_CHANGE_LINES=${VERSION_CHANGE_LINES:-0}" >> "$GITHUB_ENV"

          echo "Previous semantic release: ${LAST_VERSION:-legacy/none}"
          if [[ -n "${LAST_TAG:-}" ]]; then
            echo "Version diff range: ${VERSION_RANGE:-bootstrap}"
          fi
          echo "Version bump: $VERSION_BUMP_KIND"
          echo "Changed files: ${VERSION_CHANGE_FILES:-0}"
          echo "Changed lines: ${VERSION_CHANGE_LINES:-0}"
          echo "Version name: $VERSION_NAME"
          echo "Android versionCode: $VERSION_CODE"

      # ========================================================================
      # Android release
      # ========================================================================

      - name: Build signed release APKs
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            clean \
            assembleRelease \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE"

      # ========================================================================
      # Collect APKs
      # ========================================================================

      - name: Collect and verify APKs
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          count=0

          while IFS= read -r -d '' apk; do

            original="$(basename "$apk")"

            output="dist/MarbleNG-${VERSION_NAME}-${original#app-}"

            cp -f "$apk" "$output"

            count=$((count + 1))

          done < <(
            find \
              app/build/outputs/apk/release \
              -type f \
              -name '*.apk' \
              -print0
          )

          if (( count == 0 )); then
            echo "::error::No release APK was produced."
            exit 1
          fi

          echo "Collected $count APK(s)."

          (
            cd dist
            sha256sum *.apk > SHA256SUMS.txt
          )

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          test -x "$APKSIGNER"

          : > dist/SIGNING-CERTS.txt

          for apk in dist/*.apk; do

            echo "Verifying $(basename "$apk")"

            "$APKSIGNER" \
              verify \
              --verbose \
              --print-certs \
              "$apk" \
              >> dist/SIGNING-CERTS.txt

            echo \
              "===== $(basename "$apk") =====" \
              >> dist/SIGNING-CERTS.txt

          done

          ls -lh dist

      # ========================================================================
      # Artifact
      # ========================================================================

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MarbleNG-${{ env.VERSION_NAME }}-all-architectures
          path: dist/*
          if-no-files-found: error

      # ========================================================================
      # GitHub Release
      # ========================================================================

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="v$VERSION_NAME"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; refusing to replace an installed build."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists; refusing to move it."
            exit 1
          fi

          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"

          XRAY_VERSION="$(jq -r '.xray.tag' core-lock.json)"
          HEV_VERSION="$(jq -r '.hev.tag' core-lock.json)"

          gh release create \
            "$tag" \
            dist/* \
            --title "MarbleNG $VERSION_NAME" \
            --notes "## MarbleNG $VERSION_NAME

          ### Prism Product UI v54
          - Rebuilt MarbleNG's visual identity around the Prism design system: subtle cyan/violet/emerald ambient light, selective gradient borders, stronger depth and compact information hierarchy.
          - Fixed the real-device oversized header gap by replacing the nested TopAppBar with a custom compact header that does not apply system-bar insets twice.
          - Fixed Home route identity so transient runtime text such as "User disconnected" can never replace the selected node name.
          - Added a dedicated Android VectorDrawable Marble mark plus a runtime vector device → secure core → server illustration with shared-clock packet motion.
          - Reworked the Home hero into a focused secure-connection stage and moved live Ping/Jitter/Quality into a separate asymmetric bento with a richer verified-ping sparkline.
          - Rebuilt Home quick controls into a compact 2×2 bordered grid while retaining official Material 3 Switch semantics and fail-closed behavior.
          - Replaced the full-width flat bottom bar presentation with a bordered floating Material NavigationBar shell.
          - Reworked Library source chips, search, action buttons and filter/sort sheet for higher density and clearer action hierarchy.
          - Library avatars now use the country flag already embedded in node display names when available, while stripping the duplicate flag from the text label.
          - Strengthened semantic ping badges and the active-node halo without changing benchmark logic or source identity.
          - Rebuilt compact Settings navigation as auto-scrolling bordered category pills and removed the rectangular edge-fade masks visible in v53 screenshots.
          - Settings section surfaces now use accent borders and tighter headers; each switch row receives its own subtle bounded surface instead of reading as one giant white wall.
          - Theme selection now uses three visual preview cards for System / Prism Light / Prism Night while System mode continues to support Material You Dynamic Color.
          - Preserved Xray, HEV, routing, DNS, Intelligence, benchmark, privacy/leak containment, Quick Tile and exact source-aware deletion behavior.
          - Added flag/name unit tests and expanded Source verification with Prism-specific product invariants.

          ### Material 3 Expressive product redesign v53
          - Rebuilt primary product surfaces around stable Material 3 components while preserving MarbleNG's Xray runtime, routing, DNS, HEV, Identity Guard, benchmark and fail-closed invariants.
          - System theme now uses Android 12+ Material You Dynamic Color; explicit White and Dark themes retain deterministic Marble palettes.
          - Replaced the custom bottom dock shadow with the official Material NavigationBar and NavigationBar elevation token.
          - Removed repeated oversized Home/Library/Settings page-title blocks in favor of compact Material TopAppBars with contextual actions.
          - Rebuilt Home around an animated quality ring, touchable selected-server surface, explicit Route details row, asymmetric Ping/Jitter/Quality bento layout and recent verified-ping sparkline.
          - Added real Home quick switches for Full TUN, IPv6, Adaptive MTU and kill-switch auto recovery; fail-closed Kill Switch Armed state remains observable and is never presented as a fake disable control.
          - Moved Library source/filter/sort controls into a Material ModalBottomSheet while Refresh/Ping/Rank remain higher-emphasis FilledTonalButton actions.
          - Added semantic node avatars, compact data-driven ping badges, connected-node halo and bidirectional swipe actions: edit right, delete-confirm left.
          - Made Settings adaptive: fading horizontally scrollable tabs on compact windows and NavigationRail on wide windows.
          - Replaced the hand-built MarbleToggle with official Material 3 Switch and replaced theme chips with SingleChoiceSegmentedButtonRow.
          - Converted shared product cards to ElevatedCard/CardDefaults elevation and standardized redesigned primary surfaces on an 8dp spacing grid.
          - Added Design System documentation and unit tests for ping <100ms green, 100-250ms amber and >250ms red, with unknown evidence remaining neutral.
          - Updated Source verification so Debug/Release Kotlin compilation gates the Material 3 implementation instead of requiring the removed legacy toggle.

          ### Refined Product UI v52
          - Simplified the Solid White hierarchy around neutral tonal surfaces, restrained state accents and fewer decorative outlines.
          - Added a complete Material 3 shape and typography system with calmer light/dark brand palettes.
          - Centered and width-capped primary content and bottom navigation on wide windows instead of stretching the phone layout.
          - Reduced bottom-dock and primary-action shadow weight while keeping active-state clarity.
          - Raised custom overflow and dismiss controls to 48dp touch targets and added semantic descriptions.
          - Replaced remaining three-dot menu glyphs in high-frequency Library controls with a font-independent vector icon.
          - Reserved danger red for real error/destructive states instead of using it as a normal System-tab category color.
          - Kept active/testing outlines where they communicate state while removing nested borders from idle cards, chips, latency capsules and metadata rails.
          - Preserved swipeable Settings, long-name marquee, Home visibility controls, Quick Tile, Host/Port metadata and all network/runtime behavior.

          ### Manual chains, adaptive intelligence and Quick Tile v49
          - Restored the Compose boundary on DNS Settings after removing the legacy Chain Settings block; both Debug and Release Kotlin compilation now gate promotion before main can advance.
          - Removed the old global two-hop Chain proxy switch from Settings and moved chain creation to Library → Add → Manual config → Chain proxy.
          - Chains are saved as independent reusable Library profiles, support ordered add/move/remove controls, and have no arbitrary hop-count limit.
          - Namespaced every hop's outbound graph and internal proxy/dialer references so custom and already-composite Xray configurations can be chained safely.
          - Added a state-aware Android Quick Settings Tile: tap connects the exact last successfully used Library row, requests VPN consent through the app only when Android requires it, and toggles an active/connecting/blocked route off.
          - Marble Intelligence now persists jitter, uses workload-specific latency/jitter/reliability/speed weights, applies a conservative Wilson reliability bound, decays old failure streaks and uses a low-confidence cross-network prior.
          - Failed benchmarks no longer teach zero latency or erase previously measured throughput/jitter evidence.
          - Removed TCP-only rejection from real Xray Rank, so fronted/provider-specific nodes that work in v2rayNG are tested through their actual protocol core; minimal delay-start failure also receives one runtime-compatible config retry.
          - Reduced encrypted DoH failover deadlines after observed transient Cloudflare/Google timeouts while preserving bounded serial provider diversity and no system/plaintext DNS fallback.
          - Bug Finder's synchronous drain dropped from two seconds to 400 ms; Settings now renders only a compact summary until checks are explicitly expanded, while raw evidence and retained historical logs remain available through Copy/Save TXT.
          - Bug Finder reports passive 9-signal leak-containment coverage separately from the user-triggered external Anti-IP and DNS percentages, without creating hidden diagnostic traffic.
          - Removed the verbose verified-RTT sentence under Home quality cards and removed decorative icons beside the selected node and Route details; the underlying evidence remains available to diagnostics.
          - Preserved verified HTTPS Ping/Jitter/Quality, exact-source profile identity, anti-IP/DNS leak containment and safe route recovery invariants.

          ### Resolver, live-metric and leak-audit hardening v47
          - Fixed the observed state where the TUN carried traffic but Ping, Jitter and Quality stayed blank: the first verified HTTPS response now publishes immediately and Home explains every pending/failover phase.
          - Replaced the single measurement dependency with certificate-verified, literal-IP HTTPS targets across Cloudflare, Google and Quad9; each jitter burst remains pinned to one provider so failover never contaminates IPDV.
          - Disabled Xray parallel DNS fan-out and bounded encrypted fallbacks, preventing a blocked DoH provider from multiplying background deadlines after another resolver has already answered.
          - Iran Mode now preserves Marble Intelligence's measured resolver order instead of forcing Google first on every connection.
          - Adaptive DNS learning starts earlier, retries after heavy traffic and accepts only a valid RFC 8484 DNS-message response rather than a quick HTTP error page.
          - Upload-only traffic no longer triggers byte-counter stall recovery without an independent provider-diverse route confirmation.
          - Privacy audit now compares proxy egress against an explicitly underlay-bound physical egress, observes DNS only through SOCKS domain addressing, and reports separate Anti-IP, DNS and combined evidence scores.
          - Bug Finder now warns about retained resolver bursts and distinguishes a healthy tunnel from a missing verified quality sample.

          ### Home UI
          - Rebuilt Home around a consistent modern vector-icon language.
          - Removed font-dependent Unicode action glyphs, including the broken power symbol.
          - Added vector icons to branding, connection state, tunnel mode, connect controls, route inspection, Ping, Jitter, Quality, summary metrics, benchmark, Iran Mode, Quick Actions and network traffic.
          - Rank, Library, Privacy and Routing portals now use matching Canvas vectors.
          - Upload/download and Home status chips are font-independent.

          ### Evidence-weighted Ping, Jitter & Quality v46
          - Audited MarbleNG against v2rayNG 2.3.5 and PattNG 2.3.5-P33: retained their safe one-second TCP gate for simple profiles and real-core delay evidence, while preserving MarbleNG's richer live jitter and quality telemetry.
          - Replaced the success-only six-sample window with a bounded twelve-attempt evidence window that records verified HTTPS RTTs and misses.
          - Ping is the rolling median, Jitter is mean absolute same-target IPDV, and p90 latency exposes congested tails hidden by a median alone.
          - Quality now combines latency, jitter, verified success rate, sample confidence and p90 excess; unknown jitter is neutral instead of fabricated as zero.
          - Removed double smoothing so Quality reacts with the same rolling window as Ping and Jitter after Wi-Fi/mobile route changes.
          - Rank confidence now follows samples that actually succeeded instead of samples merely requested, and short partial runs no longer inherit full confidence.
          - Benchmark jitter now includes real spikes rather than discarding them through a short-window median.
          - Home shows verified/attempted RTT evidence, success rate and p90 next to Ping, Jitter and Quality.

          ### Swipeable Settings workspaces
          - Replaced expandable accordions with five top workspaces: General, Testing, Network, Engine and System.
          - Tabs support both tap and horizontal swipe through Compose HorizontalPager.
          - Every tab and section has a matching minimal vector icon, restrained accent color and glass surface aligned with the rest of MarbleNG.
          - Preserved Simple/Expert behavior and direct Routing navigation from Home.

          ### Library long-name marquee
          - Long node names now scroll horizontally after a short delay only when they overflow.
          - The marquee is clipped to the identity column, so ping evidence and action controls remain fixed and readable.

          ### Smart Tunnel Rank v45
          - Rebuilt Rank around the real-delay model used by v2rayNG 2.3.5 instead of tuning the failed v44 session heuristic.
          - Wired the Settings Smart mode into Rank; Smart now performs a safe one-second TCP precheck only for simple TCP profiles, while complex, UDP-native and HTTP/3 profiles go directly to the real test.
          - Every selected configuration remains visible in batch progress and receives its own final result, including TCP-gate failures.
          - Added a dedicated lightweight Xray delay-test config that strips managed DNS, routing, stats, policy, observatory, fake DNS, Fragment and Mux state.
          - Replaced rotating HEAD checks with two complete certificate-verified HTTPS GET attempts against the standard generate_204 endpoint and one ordered fallback.
          - Only HTTP 200/204 counts as tunnel health; Rank keeps the minimum valid delay and never converts a timeout into a large synthetic ping.
          - Increased isolated real-delay concurrency to a safe maximum of eight external Xray workers for substantially faster full-library completion.
          - Cleared stale card results at batch start and added per-node failure-stage evidence to Bug Finder diagnostics.
          - Preserved source-scoped testing, physical-network generation protection and deterministic temporary-process cleanup.

          ### Repeatable Tunnel Rank
          - Fixed the repeated-run regression where the same healthy library could fall from many reachable nodes to 5 and then 0.
          - Removed the synchronized warm-up plus three-new-TLS-session burst that created up to 60 proxy/server sessions for a 15-node Rank.
          - Each node now uses one real temporary Xray process, one SOCKS tunnel and one certificate-verified TLS session for its bounded RTT samples.
          - The first verified response now counts as health evidence; a later keep-alive close preserves earlier samples instead of erasing the node.
          - Rotated checks across Google connectivity, Cloudflare connectivity and two DNS-free Cloudflare anycast endpoints to avoid one-origin throttling or resolver bias.
          - Strengthened temporary native-process cleanup and reset per-worker logs so immediate reruns do not inherit sockets, processes or stale errors.
          - Added physical-network generation protection: history is not polluted across an underlay change, and a mid-Rank Wi-Fi/mobile switch triggers one settled retry.
          - Preserved full source-scoped real-Xray verification for every selected configuration; TCP Quick Ping is never accepted as tunnel health.

          ### Rank recovery & cleaner node interaction
          - Fixed the 1.2.4 regression that could report 0 reachable nodes even when every configuration connected successfully.
          - Preserved partial certificate-verified response evidence so one later read failure no longer erases an otherwise healthy node.
          - Matched Rank to connected telemetry by probing literal Cloudflare anycast IPs, removing temporary-Xray DNS failures from the result.
          - Preserved median latency, jitter, sample loss and full real-Xray verification across every selected configuration.
          - Moved Library test progress out of the Ping action and into a dedicated animated status panel with preparation, node name and completed/total state.
          - Removed progress counters from action buttons, including the misleading initial 0/0 label.
          - Removed the redundant power/stop control from every Library node card.
          - Made the full node card the Connect target while keeping the overflow menu independent.
          - Removed the redundant Active badge below node cards; the selected card remains visually highlighted.

          ### Fast, accurate Tunnel Rank
          - Replaced timeout-inflated cold HTTPS timings with verified warm-tunnel HTTP RTT samples through each exact Xray configuration.
          - Added up to three certificate-verified application RTT samples with median and jitter aggregation.
          - Tunnel latency now reports the median successful warm sample; timeouts remain failures and are never displayed as synthetic 5000/9999 ms pings.
          - Added tunnel delay variation (jitter) to node cards and incorporated it into interactive and stability ranking.
          - Kept every selected configuration in Rank; no TCP-only shortcut can incorrectly label an unverified proxy as healthy.
          - Reduced Rank probe deadlines and disabled unrelated speed/UDP work so large libraries finish substantially faster.
          - Shortened cleanup of throwaway benchmark Xray workers without changing the safer live-VPN shutdown path.
          - Added an independent DNS-free fallback target and monotonic Android elapsed-time measurement.
          - Kept progressive per-node results and source-scoped ranking, while preserving full Xray verification for every finalist.

