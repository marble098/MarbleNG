# MARBLE_RELEASE_PUBLISH_RESILIENT_V182
name: Build signed Android APKs

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App version and tag (e.g. 11.5.1; tag will be v11.5.1)'
        required: true
        type: string
      version_code:
        description: 'Android versionCode (integer greater than previous releases)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: marbleng-release
  cancel-in-progress: false

env:
  # Xray's own go.mod decides the actual Go toolchain.
  GOTOOLCHAIN: auto

jobs:
  build:
    name: Build signed MarbleNG APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ========================================================================
      # Checkout
      # ========================================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate chosen version and check for collisions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          bash scripts/release-version.sh
          printf 'VERSION_NAME=%s\nVERSION_CODE=%s\n' "$VERSION_NAME" "$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Marble system integrity preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/system-integrity-check.py

      # ========================================================================
      # Java
      # ========================================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ========================================================================
      # Android SDK
      # ========================================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
        

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358'

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" \
            >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" \
            >> "$GITHUB_ENV"

      # ========================================================================
      # Determine Go version directly from pinned Xray
      # ========================================================================

      - name: Clone pinned Xray metadata
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .bootstrap
          mkdir -p .bootstrap

          XRAY_TAG="$(jq -r '.xray.tag' core-lock.json)"

          test -n "$XRAY_TAG"
          test "$XRAY_TAG" != "null"

          echo "Pinned Xray: $XRAY_TAG"

          git clone \
            --quiet \
            --depth 1 \
            --branch "$XRAY_TAG" \
            https://github.com/XTLS/Xray-core.git \
            .bootstrap/xray

          test -s .bootstrap/xray/go.mod
          test -s .bootstrap/xray/go.sum

          echo "Xray Go requirement:"
          grep '^go ' .bootstrap/xray/go.mod

      - name: Set up Xray Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: .bootstrap/xray/go.mod
          cache: true
          cache-dependency-path: .bootstrap/xray/go.sum

      - name: Verify Go environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Bootstrap Go:"
          go version

          echo
          echo "GOTOOLCHAIN:"
          echo "$GOTOOLCHAIN"

          echo
          echo "Pinned Xray go.mod:"
          grep '^go ' .bootstrap/xray/go.mod

      # ========================================================================
      # Native Xray + HEV + JNI
      # ========================================================================

      - name: Prepare all native ABIs
        shell: bash
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail

          chmod +x scripts/prepare-native.sh
          ./scripts/prepare-native.sh

      # ========================================================================
      # Verified routing data bundled into the APK
      # ========================================================================

      - name: Bundle verified Iran routing assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # MARBLE_ROUTING_ASSET_PIN_V257 — the branch tip is resolved to one commit and every file
          # is fetched by that commit. The 2026-11-01 release build failed here because the old
          # inline version fetched `geoip.dat` and `geoip.dat.sha256sum` separately *by branch path*
          # from a source that force-pushes a whole new snapshot on every publish: the binary came
          # from one commit and the digest from the next, `test "$actual" = "$expected"` failed, and
          # the step exited 1 without printing why. See scripts/bundle-routing-assets.sh.
          bash scripts/bundle-routing-assets.sh

      # ========================================================================
      # Gradle
      # ========================================================================

      - name: Read the pinned Gradle version
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^gradle=//p' gradle/toolchain.properties | tail -n 1)"
          echo "gradle=${version:-9.5.1}" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.toolchain.outputs.gradle }}

      # ========================================================================
      # Restore + validate signing identity
      # ========================================================================

      - name: Restore and validate stable release signer
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$*"
            exit 1
          }

          test -n "${KS_B64:-}" || fail "ANDROID_KEYSTORE_B64 is missing."
          test -n "${KS_PASS:-}" || fail "ANDROID_KEYSTORE_PASSWORD is missing."
          test -n "${KS_ALIAS:-}" || fail "ANDROID_KEY_ALIAS is missing."
          test -n "${KEY_PASS:-}" || fail "ANDROID_KEY_PASSWORD is missing."

          rm -f release.jks signing.properties

          printf '%s' "$KS_B64" |
            base64 --decode > release.jks

          chmod 600 release.jks

          test -s release.jks ||
            fail "Decoded release keystore is empty."

          if ! keytool \
              -list \
              -keystore release.jks \
              -storepass "$KS_PASS" \
              -alias "$KS_ALIAS" \
              >/dev/null 2>&1
          then
            fail "Keystore/store password/alias validation failed."
          fi

          echo "[OK] Keystore container and alias are valid."

          cat > "$RUNNER_TEMP/VerifyMarbleNGKey.java" <<'JAVA'
          import java.io.File;
          import java.security.Key;
          import java.security.KeyStore;

          public final class VerifyMarbleNGKey {
              public static void main(String[] args) throws Exception {
                  if (args.length != 4) {
                      throw new IllegalArgumentException(
                          "Expected: <keystore> <storePass> <alias> <keyPass>"
                      );
                  }

                  File file = new File(args[0]);

                  KeyStore store = KeyStore.getInstance(
                      file,
                      args[1].toCharArray()
                  );

                  if (!store.containsAlias(args[2])) {
                      throw new IllegalStateException(
                          "Signing alias does not exist"
                      );
                  }

                  Key key = store.getKey(
                      args[2],
                      args[3].toCharArray()
                  );

                  if (key == null) {
                      throw new IllegalStateException(
                          "Private signing key could not be loaded"
                      );
                  }
              }
          }
          JAVA

          verify_key_password() {
            java \
              "$RUNNER_TEMP/VerifyMarbleNGKey.java" \
              "$PWD/release.jks" \
              "$KS_PASS" \
              "$KS_ALIAS" \
              "$1" \
              >/dev/null 2>&1
          }

          EFFECTIVE_KEY_PASS=""

          if verify_key_password "$KEY_PASS"; then

            EFFECTIVE_KEY_PASS="$KEY_PASS"

            echo "[OK] Private key password validated."

          elif verify_key_password "$KS_PASS"; then

            EFFECTIVE_KEY_PASS="$KS_PASS"

            echo "::warning::Legacy MarbleNG PKCS12 password mismatch detected."
            echo "::warning::Using the store password as the effective private-key password."
            echo "[OK] Existing signing identity recovered without key rotation."

          else

            fail "Private signing key cannot be decrypted with either configured password. Do NOT regenerate the keystore if preserving the app signature matters."

          fi

          {
            printf 'storeFile=release.jks\n'
            printf 'storePassword=%s\n' "$KS_PASS"
            printf 'keyAlias=%s\n' "$KS_ALIAS"
            printf 'keyPassword=%s\n' "$EFFECTIVE_KEY_PASS"
          } > signing.properties

          chmod 600 signing.properties

          if ! verify_key_password "$EFFECTIVE_KEY_PASS"; then
            fail "Final signing verification unexpectedly failed."
          fi

          echo "[OK] Release signing identity is ready."

          echo
          echo "Signing certificate:"
          keytool \
            -list \
            -v \
            -keystore release.jks \
            -storepass "$KS_PASS" \
            -alias "$KS_ALIAS" |
            grep -E 'Alias name:|Owner:|Issuer:|SHA256:' |
            head -n 8 || true

      # ========================================================================
      # Android release
      # ========================================================================

      - name: Build signed release APKs
        shell: bash
        run: |
          set -euo pipefail

          # MARBLE_RELEASE_PACKAGING_V214 — serialize the release build. Run 307 died in
          # :app:packageRelease's IncrementalSplitterRunnable with no root-cause line and
          # the identical tree packaged green on re-run (diagnostic run 38412976243):
          # AGP's splitter writes the five ABI/universal APKs from ~500 MB of merged
          # native libraries, and with parallel workers those writers race/OOM
          # intermittently. One worker makes the splitter write one APK at a time;
          # the task graph here is nearly linear (Kotlin/R8 are single tasks whose
          # internal threading is unaffected), so the determinism costs little time.
          # The matching heap headroom lives in gradle.properties.
          gradle \
            --no-daemon \
            --max-workers=1 \
            clean \
            assembleRelease \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE"

      # ========================================================================
      # Collect APKs
      # ========================================================================

      - name: Collect and verify APKs
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          count=0

          while IFS= read -r -d '' apk; do

            original="$(basename "$apk")"

            output="dist/MarbleNG-${VERSION_NAME}-${original#app-}"

            cp -f "$apk" "$output"

            count=$((count + 1))

          done < <(
            find \
              app/build/outputs/apk/release \
              -type f \
              -name '*.apk' \
              -print0
          )

          if (( count == 0 )); then
            echo "::error::No release APK was produced."
            exit 1
          fi

          echo "Collected $count APK(s)."

          (
            cd dist
            sha256sum *.apk > SHA256SUMS.txt
          )

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          test -x "$APKSIGNER"

          : > dist/SIGNING-CERTS.txt

          for apk in dist/*.apk; do

            echo "Verifying $(basename "$apk")"

            "$APKSIGNER" \
              verify \
              --verbose \
              --print-certs \
              "$apk" \
              >> dist/SIGNING-CERTS.txt

            echo \
              "===== $(basename "$apk") =====" \
              >> dist/SIGNING-CERTS.txt

          done

          ls -lh dist

      # ========================================================================
      # MARBLE_RELEASE_INSTALL_GATE_V217 — verify the install contract on the
      # built APKs themselves, before anything is uploaded.
      # ========================================================================

      - name: Verify the APK install contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Everything Android checks when a user taps Install over an existing copy:
          # the package name, a versionCode strictly newer than the one already on the
          # phone, the extraction contract for the compressed native cores, the ABI
          # payload of each split, and the SAME signing certificate as the release the
          # phone already carries. apksigner proves a signature is well-formed, not
          # that it is the same identity, and before V217 nothing proved the version
          # properties or extractNativeLibs actually landed in the packaged manifest.
          # A release that breaks any of these installs nowhere: the phone answers
          # "App not installed" / "app not updated" and the pipeline stayed green.

          AAPT2="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          test -x "$AAPT2"
          test -x "$APKSIGNER"

          normalize_abis() {
            # aapt2 space-separates quoted ABIs on build-tools 36
            # (`'arm64-v8a' 'armeabi-v7a'`); older build-tools comma-separate.
            # Split on both before the set comparison.
            tr ',' ' ' | tr -s ' ' '\n' | tr -d "'" |
              awk 'NF' | sort -u | tr '\n' ' ' | sed 's/ $//'
          }

          badging_package_line() {
            # Full-stream awk, never grep -m1: an early-exiting reader SIGPIPEs
            # aapt2 under pipefail (the class of bug prepare-native.sh documents).
            "$AAPT2" dump badging "$1" |
              awk '/^package:/ && !found { print; found = 1 }'
          }

          package_name_of() {
            badging_package_line "$1" |
              sed -n "s/^package: name='\([^']*\)'.*$/\1/p"
          }

          version_code_of() {
            badging_package_line "$1" |
              sed -n "s/^package: name='[^']*' versionCode='\([0-9]*\)'.*$/\1/p"
          }

          version_name_of() {
            badging_package_line "$1" |
              sed -n "s/^package: name='[^']*' versionCode='[0-9]*' versionName='\([^']*\)'.*$/\1/p"
          }

          native_code_of() {
            # aapt2 prints `native-code: 'arm64-v8a'` (AGP 9's build-tools);
            # older build-tools printed `native-code::'arm64-v8a'`. Accept both.
            "$AAPT2" dump badging "$1" |
              sed -n "s/^native-code:*[[:space:]]*//p"
          }

          certificate_of() {
            "$APKSIGNER" verify --print-certs "$1" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: \([0-9a-fA-F]*\)$/\1/p'
          }

          shopt -s nullglob
          apks=(dist/*.apk)
          (( ${#apks[@]} > 0 )) || {
            echo "::error::No APK found for the install-contract gate."
            exit 1
          }

          # Require every expected split as well as the universal APK; a partial
          # build must not be mistaken for an all-architectures release.
          (( ${#apks[@]} == 5 )) || { echo "::error::Expected exactly five APKs, got ${#apks[@]}."; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86_64 x86 universal; do
            test -s "dist/MarbleNG-${VERSION_NAME}-${abi}-release.apk" || {
              echo "::error::Missing APK for $abi."; exit 1;
            }
          done

          release_certificate=""

          for apk in "${apks[@]}"; do

            name="$(basename "$apk")"

            echo
            echo "------------------------------------------------------------"
            echo "Install contract: $name"
            echo "------------------------------------------------------------"

            pkg="$(package_name_of "$apk")"
            code="$(version_code_of "$apk")"
            vname="$(version_name_of "$apk")"

            [[ "$pkg" == "com.marbleng.app" ]] || {
              echo "::error::$name: packaged package name is '$pkg', expected 'com.marbleng.app'."
              exit 1
            }

            [[ -n "$code" ]] || {
              echo "::error::$name: could not read versionCode from the packaged manifest."
              exit 1
            }

            [[ "$code" == "$VERSION_CODE" ]] || {
              echo "::error::$name: packaged versionCode is '$code', expected '$VERSION_CODE'. A stale or missing -PVERSION_CODE ships a silent downgrade; every phone with a newer code refuses the update ('App not installed')."
              exit 1
            }

            [[ "$vname" == "$VERSION_NAME" ]] || {
              echo "::error::$name: packaged versionName is '$vname', expected '$VERSION_NAME'."
              exit 1
            }

            stem="${name#MarbleNG-${VERSION_NAME}-}"
            abi="${stem%-release.apk}"

            declared="$(native_code_of "$apk" | normalize_abis)"

            if [[ "$abi" == "universal" ]]; then
              expected="$(printf '%s\n' armeabi-v7a arm64-v8a x86 x86_64 | normalize_abis)"
            else
              expected="$abi"
            fi

            [[ -n "$declared" && "$declared" == "$expected" ]] || {
              echo "::error::$name: packaged native code is '${declared:-none}', expected '$expected'."
              exit 1
            }

            extract_line="$(
              "$AAPT2" dump xmltree --file AndroidManifest.xml "$apk" |
                grep -m1 'extractNativeLibs' || true
            )"

            if [[ -n "$extract_line" ]]; then
              # AGP 9's aapt2 prints the resolved boolean (=true/=false); older
              # build-tools print the raw typed value
              # (=(type 0x12)0xffffffff / 0x0). Accept both generations.
              if grep -Eq 'extractNativeLibs[^=]*=(false|\(type 0x12\)0x0+)[[:space:]]*$' <<< "$extract_line"; then
                echo "::error::$name: android:extractNativeLibs is false ('$extract_line'). Compressed native entries the installer may not extract are the documented instant-install-failure: 'App not installed' (INSTALL_FAILED_INVALID_APK: Failed to extract native libraries, res=-2)."
                exit 1
              fi
              grep -Eq 'extractNativeLibs[^=]*=(true|\(type 0x12\)0x[fF]+)[[:space:]]*$' <<< "$extract_line" || {
                echo "::error::$name: cannot parse android:extractNativeLibs ('$extract_line'); failing loud rather than guessing."
                exit 1
              }
            else
              echo "::notice::$name: android:extractNativeLibs is absent; the platform default (true) applies."
            fi

            stored_libs="$(
              unzip -v "$apk" |
                awk '$2 ~ /^Stored/ && $NF ~ /^lib\// { print $NF }'
            )"

            [[ -z "$stored_libs" ]] || {
              echo "::error::$name: uncompressed native entries: $(echo "$stored_libs" | tr '\n' ' '). useLegacyPackaging=true must keep every lib/* entry DEFLATED; a silently uncompressed payload means the AGP packaging contract flipped."
              exit 1
            }

            cert="$(certificate_of "$apk")"

            [[ -n "$cert" ]] || {
              echo "::error::$name: could not read the signing certificate digest."
              exit 1
            }

            if [[ -z "$release_certificate" ]]; then
              release_certificate="$cert"
            elif [[ "$cert" != "$release_certificate" ]]; then
              echo "::error::$name: signed with a different certificate than the other APKs of this release."
              exit 1
            fi

            echo "[OK] $name: package=$pkg versionCode=$code versionName=$vname abi=$abi extract=true libs=deflated"

          done

          echo
          echo "Release signing certificate SHA-256: $release_certificate"

          # ----------------------------------------------------------------
          # Baseline: the newest published release is what phones carry.
          # The update must be strictly newer and signed with the same
          # certificate, unless release-signing.lock pins an intentional
          # rotation.
          # ----------------------------------------------------------------

          pinned_certificate=""

          if [[ -f release-signing.lock ]]; then
            pinned_certificate="$(
              jq -r '.signingCertSha256 // empty' release-signing.lock 2>/dev/null || true
            )"
            if [[ -n "$pinned_certificate" ]] &&
               [[ ! "$pinned_certificate" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "::error::release-signing.lock carries a malformed signingCertSha256 (expected 64 hex characters)."
              exit 1
            fi
          fi

          baseline_tag="$(
            gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName \
              2>/dev/null || true
          )"

          if [[ -z "$baseline_tag" ]]; then

            echo "No published release yet; baseline guards skipped (bootstrap)."

          else

            baseline_dir="$RUNNER_TEMP/install-gate-baseline"
            rm -rf "$baseline_dir"
            mkdir -p "$baseline_dir"

            baseline_apk=""

            if gh release download "$baseline_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --dir "$baseline_dir" \
                --pattern '*-arm64-v8a-release.apk' \
                --clobber; then
              baseline_apk="$(
                find "$baseline_dir" -type f -name '*.apk' -print -quit
              )"
            fi

            if [[ -z "$baseline_apk" ]]; then
              echo "::notice::$baseline_tag has no downloadable arm64 APK; baseline guards skipped."
            else

              baseline_code="$(version_code_of "$baseline_apk")"
              baseline_cert="$(certificate_of "$baseline_apk")"

              if [[ -n "$baseline_code" ]]; then
                if (( baseline_code >= VERSION_CODE )); then
                  echo "::error::Refusing to ship a downgrade: $baseline_tag carries versionCode $baseline_code, this build is $VERSION_CODE. Android rejects updates whose versionCode is not strictly newer ('App not installed')."
                  exit 1
                fi
                echo "[OK] versionCode $VERSION_CODE is strictly newer than $baseline_tag's $baseline_code"
              else
                echo "::warning::Could not read $baseline_tag's versionCode; downgrade guard skipped."
              fi

              expected_certificate="${pinned_certificate:-$baseline_cert}"

              [[ -n "$expected_certificate" ]] || {
                echo "::error::Could not read the signing certificate of $baseline_tag and no release-signing.lock pin exists; signing continuity cannot be proven."
                exit 1
              }

              if [[ "$release_certificate" != "$expected_certificate" ]]; then
                echo "::error::Signing identity changed: this build signs with SHA-256 $release_certificate, but $baseline_tag — the release phones have installed — signs with $expected_certificate. Android refuses to update an app whose certificate differs, so every existing install fails with 'App not installed' / 'app not updated'. Restore the previous ANDROID_KEYSTORE_B64, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD secrets; or, if the rotation is intentional, record the new digest in release-signing.lock and tell users to uninstall first."
                exit 1
              fi

              if [[ -n "$pinned_certificate" ]]; then
                echo "[OK] signing certificate matches the release-signing.lock pin"
              else
                echo "[OK] signing certificate matches $baseline_tag"
              fi

            fi

          fi

          echo "RELEASE_CERT_SHA256=$release_certificate" >> "$GITHUB_ENV"

          echo
          echo "[OK] APK install contract verified on every release APK."

      # ========================================================================
      # Artifact
      # ========================================================================

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MarbleNG-${{ env.VERSION_NAME }}-all-architectures
          path: dist/*
          if-no-files-found: error

      # V242: keep the R8 dictionary beside the APKs so a field logcat can be retraced
      # without guessing from obfuscated class names. It is a CI artifact, not a release asset.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: MarbleNG-${{ env.VERSION_NAME }}-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      # ========================================================================
      # GitHub Release (SMART, SELF-HEALING PUBLISH)
      # ========================================================================

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GH_HTTP_TIMEOUT=600

          repo="${GITHUB_REPOSITORY}"
          tag="v$VERSION_NAME"
          shopt -s nullglob
          assets=(dist/*)
          apks=(dist/*.apk)

          if (( ${#apks[@]} == 0 )); then
            echo "::error::No signed APK assets found in dist/."
            exit 1
          fi
          test -s dist/SHA256SUMS.txt
          test -s dist/SIGNING-CERTS.txt

          # Recheck after the build. Never advance, overwrite, or delete a
          # pre-existing tag or release, including an unpublished draft.
          bash scripts/release-version.sh

          XRAY_VERSION="$(jq -r '.xray.tag' core-lock.json)"
          HEV_VERSION="$(jq -r '.hev.tag' core-lock.json)"
          notes_file="$RUNNER_TEMP/marbleng-release-notes.md"
          previous_tag="$(git tag --list | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V | tail -n 1)"

          {
            printf '## MarbleNG %s\n\n' "$VERSION_NAME"
            printf '### Changes in this release\n'
            if [[ -n "$previous_tag" ]]; then
              git log --no-merges --pretty='- %s' "${previous_tag}..${GITHUB_SHA}"
            else
              git log -n 50 --no-merges --pretty='- %s' "$GITHUB_SHA"
            fi
            printf '\n### Runtime cores\n'
            printf -- '- Xray: `%s`\n' "$XRAY_VERSION"
            printf -- '- HEV: `%s`\n' "$HEV_VERSION"
            printf '\n### Build identity\n'
            printf -- '- Android `versionCode`: `%s`\n' "$VERSION_CODE"
            printf -- '- Signing certificate SHA-256: `%s`\n' "${RELEASE_CERT_SHA256:-not recorded}"
            printf '\n### Build integrity\n'
            printf '%s\n' '- Release APKs are built, signed and verified in GitHub Actions.'
            printf '%s\n' '- `SHA256SUMS.txt` contains the SHA-256 digest of every APK.'
            printf '%s\n' '- `SIGNING-CERTS.txt` records the verified signing certificate.'
          } > "$notes_file"
          test -s "$notes_file"

          create_json="$RUNNER_TEMP/release-create.json"
          jq -n \
            --arg tag "$tag" \
            --arg target "$GITHUB_SHA" \
            --arg name "MarbleNG $VERSION_NAME" \
            --rawfile body "$notes_file" \
            '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:true,prerelease:false}' \
            > "$create_json"

          # Creating the ref is atomic: a competing run cannot make us publish
          # against an existing tag between the collision check and release creation.
          gh api --method POST "repos/$repo/git/refs" \
            -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
          echo "Created $tag at $GITHUB_SHA. If publishing fails, inspect and remove the tag/draft manually before retrying."

          release_json="$(gh api --method POST "repos/$repo/releases" --input "$create_json")"
          release_id="$(jq -r '.id // empty' <<< "$release_json")"
          release_upload_url="$(jq -r '.upload_url // empty' <<< "$release_json")"
          upload_base="${release_upload_url%%\{*}"

          [[ "$release_id" =~ ^[0-9]+$ ]] || {
            echo "::error::Invalid draft release id."
            exit 1
          }
          [[ "$upload_base" == https://uploads.github.com/* ]] || {
            echo "::error::Invalid draft upload URL."
            exit 1
          }

          remote_asset_json() {
            local name="$1"
            gh api "repos/$repo/releases/$release_id/assets?per_page=100" |
              jq -c --arg name "$name" '[.[] | select(.name == $name)] | if length == 0 then null else .[0] end'
          }

          urlencode_asset_name() {
            jq -rn --arg value "$1" '$value|@uri'
          }

          upload_one_asset() {
            local asset="$1" name name_q local_size attempt existing existing_id existing_size remote remote_size
            local response_file http_code curl_rc api_message
            name="$(basename "$asset")"
            local_size="$(stat -c '%s' "$asset")"
            (( local_size > 0 )) || { echo "::error::Empty asset: $name"; return 1; }

            for attempt in 1 2 3 4 5 6; do
              echo "Uploading $name (${local_size} bytes), attempt $attempt/6"

              existing="$(remote_asset_json "$name")"
              if [[ "$existing" != "null" ]]; then
                existing_id="$(jq -r '.id // empty' <<< "$existing")"
                existing_size="$(jq -r '.size // 0' <<< "$existing")"
                if [[ "$existing_size" == "$local_size" ]]; then
                  echo "Already complete remotely: $name"
                  return 0
                fi
                if [[ "$existing_id" =~ ^[0-9]+$ ]]; then
                  gh api --method DELETE "repos/$repo/releases/assets/$existing_id" >/dev/null || true
                fi
              fi

              name_q="$(urlencode_asset_name "$name")"
              response_file="$RUNNER_TEMP/release-upload-${attempt}.json"
              curl_rc=0

              http_code="$(
                curl \
                  --silent \
                  --show-error \
                  --location \
                  --output "$response_file" \
                  --write-out '%{http_code}' \
                  --request POST \
                  --header "Authorization: Bearer $GH_TOKEN" \
                  --header "Accept: application/vnd.github+json" \
                  --header "X-GitHub-Api-Version: 2022-11-28" \
                  --header "Content-Type: application/octet-stream" \
                  --data-binary "@$asset" \
                  "${upload_base}?name=${name_q}"
              )" || curl_rc=$?

              if (( curl_rc == 0 )) && [[ "$http_code" =~ ^20[01]$ ]]; then
                remote="$(remote_asset_json "$name")"
                remote_size="$(jq -r '.size // 0' <<< "$remote")"
                if [[ "$remote_size" == "$local_size" ]]; then
                  echo "Verified remote asset: $name"
                  return 0
                fi
                echo "::warning::Remote size mismatch after upload: $name"
              else
                api_message="$(jq -r '.message // empty' "$response_file" 2>/dev/null || true)"
                echo "::warning::Upload attempt $attempt failed: $name (curl=$curl_rc http=$http_code $api_message)"
              fi

              if (( attempt < 6 )); then
                case "$attempt" in
                  1) sleep 5 ;;
                  2) sleep 10 ;;
                  3) sleep 20 ;;
                  4) sleep 40 ;;
                  5) sleep 60 ;;
                esac
              fi
            done

            echo "::error::Upload retries exhausted: $name"
            return 1
          }

          for asset in "${assets[@]}"; do
            upload_one_asset "$asset"
          done

          remote_assets="$(gh api "repos/$repo/releases/$release_id/assets?per_page=100")"
          if [[ "$(jq 'length' <<< "$remote_assets")" -ne "${#assets[@]}" ]]; then
            echo "::error::Remote asset count mismatch."
            exit 1
          fi

          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            local_size="$(stat -c '%s' "$asset")"
            match_count="$(jq --arg name "$name" --argjson size "$local_size" '[.[] | select(.name == $name and .size == $size)] | length' <<< "$remote_assets")"
            [[ "$match_count" -eq 1 ]] || {
              echo "::error::Remote release verification failed: $name"
              exit 1
            }
          done

          echo "Draft release successfully created and assets uploaded. Waiting for your manual approval to publish."
