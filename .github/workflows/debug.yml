name: Debug compilation
on:
  push:
    branches:
      - 'arena/*'
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Try compile
        id: compile
        run: |
          set -o pipefail
          gradle --no-daemon :app:compileDebugKotlin :app:compileReleaseKotlin 2>&1 | tee /tmp/compile.log
          echo "exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true
      - name: Try tests
        id: tests
        if: steps.compile.outputs.exit == '0'
        run: |
          gradle --no-daemon :app:testDebugUnitTest --tests "com.marbleng.app.core.IpFamilyScannerTest" 2>&1 | tee /tmp/test.log
          echo "exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true
      - name: Post compile log as comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Compile exit: ${{ steps.compile.outputs.exit }}"
          echo "Tests exit: ${{ steps.tests.outputs.exit }}"
          cat /tmp/compile.log | tail -n 200 > /tmp/compile_tail.txt || echo "no compile log" > /tmp/compile_tail.txt
          cat /tmp/test.log | tail -n 300 > /tmp/test_tail.txt || echo "no test log" > /tmp/test_tail.txt
          COMMENT="## Debug compilation result
          Compile exit: ${{ steps.compile.outputs.exit }}
          Tests exit: ${{ steps.tests.outputs.exit }}

          ### Compile tail
          \`\`\`
          $(cat /tmp/compile_tail.txt)
          \`\`\`

          ### Test tail
          \`\`\`
          $(cat /tmp/test_tail.txt)
          \`\`\`
          "
          # Find PR for this branch
          PR=$(gh pr list --head ${{ github.ref_name }} --json number -q '.[0].number')
          echo "PR $PR"
          if [ -n "$PR" ]; then
            gh pr comment $PR --body "$COMMENT" || echo "$COMMENT"
          else
            echo "$COMMENT"
          fi
