name: Arena diagnostics
# Temporary: the sandbox this branch is edited from cannot read Actions logs, so the runner
# publishes what it learns as a PR comment instead.
on:
  push:
    branches: [arena/b26531a4-marbleng]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Newest toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'MARBLE_TOOLCHAIN_AUTOPILOT report'
            echo
            echo '```'
            python3 scripts/resolve-toolchain.py 2>&1 || true
            echo '```'
          } > report.md
          cat report.md

      - name: Publish as a PR comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "arena/b26531a4-marbleng" --json number --jq '.[0].number' || true)"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file report.md
          else
            echo "no pull request for this branch"
          fi
