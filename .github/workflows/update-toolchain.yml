name: Update toolchain
# MARBLE_TOOLCHAIN_AUTOPILOT_V211 — the build updates itself: Gradle, AGP, Kotlin, the Compose
# BOM, the androidx libraries, jsch, ZXing, org.json and JUnit.
#
# MARBLE_LATEST_VERSION_RULE_V235 — the target is the one rule every updater in this repo now
# answers to: the newest *published* version of every component, beta or release or any other
# qualifier. (Nightly snapshots stay excluded — unpublished work, this world's drafts.) The
# pre-V235 compatibility line no longer caps the target; it is the fallback. The flow is:
#
#   1. resolve newest-published (`--write`) and prove `:app:compileDebugKotlin`;
#   2. if that proof fails, throw the file away, resolve `--in-line-only` (newest inside each
#      compatibility line) and prove that instead;
#   3. push only a set that compiled. If neither compiles, nothing is pushed and the errors
#      are left in the log.
#
# One file holds the versions (`gradle/toolchain.properties`), one script resolves them
# (`scripts/resolve-toolchain.py`), and everything else in the tree reads that file — so this
# job is the whole update: resolve, prove, commit, push. It pushes only after a compile
# succeeds, because a toolchain bump is the one change that can break every line of the
# product at once; the compile, not a version-number convention, is the safety property.
on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marbleng-toolchain-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Resolve the newest published version of every component
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/resolve-toolchain.py --write
          echo
          echo "Pins after the resolve:"
          python3 scripts/resolve-toolchain.py --offline

      - name: Did anything move?
        id: moved
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- gradle/toolchain.properties; then
            echo "moved=no" >> "$GITHUB_OUTPUT"
            echo "MARBLE_TOOLCHAIN_AUTOPILOT: already at the newest published version of everything."
          else
            echo "moved=yes" >> "$GITHUB_OUTPUT"
            git diff -- gradle/toolchain.properties
          fi

      - name: Set up JDK 17
        if: steps.moved.outputs.moved == 'yes'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.moved.outputs.moved == 'yes'
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install compile SDK
        if: steps.moved.outputs.moved == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Read the pinned Gradle version
        if: steps.moved.outputs.moved == 'yes'
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^gradle=//p' gradle/toolchain.properties | tail -n 1)"
          echo "gradle=${version:-9.5.1}" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        if: steps.moved.outputs.moved == 'yes'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.toolchain.outputs.gradle }}

      # continue-on-error is the whole point of the step: a red compile here is not a dead
      # job, it is the signal to try the in-line fallback. The outcome is read below.
      - name: Prove the newest published toolchain compiles the app
        if: steps.moved.outputs.moved == 'yes'
        id: compile_newest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:compileDebugKotlin 2>&1 | tee toolchain-ci.log

      - name: Fall back to the newest in-line versions when the newest does not build
        if: steps.moved.outputs.moved == 'yes' && steps.compile_newest.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo "MARBLE_LATEST_VERSION_RULE_V235: the newest published set did not compile."
          echo "Resolving the in-line fallback (--in-line-only) and proving that instead."
          grep -E "^(e: |error:)|FAILED|Execution failed" toolchain-ci.log | tail -n 30 || true
          git checkout -- gradle/toolchain.properties
          python3 scripts/resolve-toolchain.py --in-line-only --write
          git diff -- gradle/toolchain.properties || true

      - name: Read the fallback Gradle version
        if: steps.moved.outputs.moved == 'yes' && steps.compile_newest.outcome == 'failure'
        id: toolchain_fallback
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^gradle=//p' gradle/toolchain.properties | tail -n 1)"
          echo "gradle=${version:-9.5.1}" >> "$GITHUB_OUTPUT"

      - name: Set up the fallback Gradle
        if: steps.moved.outputs.moved == 'yes' && steps.compile_newest.outcome == 'failure'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.toolchain_fallback.outputs.gradle }}

      - name: Prove the in-line fallback compiles the app
        if: steps.moved.outputs.moved == 'yes' && steps.compile_newest.outcome == 'failure'
        shell: bash
        run: |
          set -o pipefail
          if git diff --quiet -- gradle/toolchain.properties; then
            echo "MARBLE_TOOLCHAIN_AUTOPILOT: the in-line fallback changes nothing; nothing to prove."
            exit 0
          fi
          gradle --no-daemon :app:compileDebugKotlin 2>&1 | tee toolchain-ci.log

      - name: Publish the compiler errors when neither set builds
        if: failure() && steps.moved.outputs.moved == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          echo "MARBLE_TOOLCHAIN_AUTOPILOT: nothing was committed — neither the newest published"
          echo "set nor the in-line fallback compiles. The error lines follow."
          grep -E "^(e: |error:)|FAILED|Execution failed" toolchain-ci.log | tail -n 60 || true

      - name: Did a compilable set move?
        if: steps.moved.outputs.moved == 'yes' && success()
        id: moved_final
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- gradle/toolchain.properties; then
            echo "moved=no" >> "$GITHUB_OUTPUT"
          else
            echo "moved=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.moved_final.outputs.moved == 'yes' && success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marble-toolchain-bot"
          git config user.email "toolchain-bot@users.noreply.github.com"
          git add gradle/toolchain.properties
          {
            echo "toolchain: update to the newest published version of every component"
            echo
            echo "MARBLE_TOOLCHAIN_AUTOPILOT_V211 / MARBLE_LATEST_VERSION_RULE_V235 — resolved by"
            echo "scripts/resolve-toolchain.py and proved by :app:compileDebugKotlin before this"
            echo "commit was made (newest-published set, or the in-line fallback when the newest"
            echo "did not build; the workflow log says which)."
            echo
            python3 scripts/resolve-toolchain.py --offline
          } > /tmp/commit-msg
          git commit -F /tmp/commit-msg
          git push origin HEAD:main
