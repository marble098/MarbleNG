name: Update beta cores
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marbleng-core-updater
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Resolve newest upstream channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-core-lock.sh
      - name: Validate the resolved lock
        shell: bash
        run: |
          set -euo pipefail
          # MARBLE_SINGBOX_CORE_V151 — three cores now, and this job pushes straight to main, so a
          # half-resolved lock must die here rather than in somebody's release build.
          jq -e '.xray.tag and .xray.repo' core-lock.json
          jq -e '.hev.tag and .hev.repo' core-lock.json
          jq -e '.singbox.tag and .singbox.repo' core-lock.json
          [[ "$(jq -r '.singbox.channel' core-lock.json)" == "beta" ]]
          jq -r '"xray \(.xray.tag)  hev \(.hev.tag)  singbox \(.singbox.tag)"' core-lock.json

          # MARBLE_SINGBOX_ANDROID_CLI_CRASH_V157 — the Android core is compiled from source, so
          # the lock has to name the commit the tag resolved to, and MarbleNG's backport level has
          # to survive the rewrite (update-core-lock.sh only touches tags, commit, digest, date).
          [[ "$(jq -r '.singbox.commit' core-lock.json)" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$(jq -r '.singbox.patch // empty' core-lock.json)" ]]
          jq -e '.singbox.sha256 | length == 1' core-lock.json
      - name: Clone resolved Xray, HEV and sing-box sources
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/core-updater-smoke"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          XRAY_REPO="$(jq -r '.xray.repo' core-lock.json)"
          XRAY_TAG="$(jq -r '.xray.tag' core-lock.json)"
          HEV_REPO="$(jq -r '.hev.repo' core-lock.json)"
          HEV_TAG="$(jq -r '.hev.tag' core-lock.json)"
          SINGBOX_REPO="$(jq -r '.singbox.repo' core-lock.json)"
          SINGBOX_TAG="$(jq -r '.singbox.tag' core-lock.json)"
          SINGBOX_COMMIT="$(jq -r '.singbox.commit' core-lock.json)"

          git clone --quiet --depth 1 --branch "$XRAY_TAG" \
            "https://github.com/${XRAY_REPO}.git" "$WORK/xray"
          git clone --quiet --depth 1 --branch "$HEV_TAG" \
            "https://github.com/${HEV_REPO}.git" "$WORK/hev"
          git clone --quiet --depth 1 --branch "$SINGBOX_TAG" \
            "https://github.com/${SINGBOX_REPO}.git" "$WORK/singbox"

          test "$(git -C "$WORK/singbox" rev-parse HEAD)" = "$SINGBOX_COMMIT"
          test -s "$WORK/xray/go.mod"

          # Prove HEV's upstream JNI glue anchor still matches prepare-native.sh.
          test -f "$WORK/hev/src/hev-jni.c"
          grep -q 'JNI_OnLoad' "$WORK/hev/src/hev-jni.c"
          grep -q 'hev/htproxy' "$WORK/hev/src/hev-jni.c"

          # Prove Xray's source patches and Rank command anchor still apply.
          cp native/rankhelper/main.go "$WORK/xray/main/marble_rank.go"
          python3 scripts/inject-xray-realtime.py "$WORK/xray"
          python3 scripts/inject-xray-config-superset.py "$WORK/xray"
          python3 - "$WORK/xray/main/main.go" <<'PYXRAY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          old = "\t\t\tcmdRun,\n\t\t\tcmdVersion,\n"
          if source.count(old) != 1:
              raise SystemExit("Pinned Xray command anchor changed")
          PYXRAY
      - name: Set up the resolved Xray Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: "${{ runner.temp }}/core-updater-smoke/xray/go.mod"
          cache: false
      - name: Prove the Android crash backport still applies
        shell: bash
        run: |
          set -euo pipefail
          # This job pushes straight to main. A newer sing-box tag whose source moved one of the
          # backport anchors — or changed a Go signature the injected tests call — would make every
          # release build die inside prepare-native.sh, minutes into a four-ABI compile. Running
          # both injectors AND compiling their Go regression tests under the resolved Xray's Go
          # toolchain turns that into a fast failure in the updater and keeps the lock honest.
          #
          # MARBLE_SINGBOX_GO127_FORCE_CLOSE_V161: the Go 1.27 force-close injector and its
          # badlinkname link pin run here for the same reason — the Xray pin this same job resolves
          # decides the Go toolchain that links sing-box in release builds.
          TAG="$(jq -r '.singbox.tag' core-lock.json)"
          COMMIT="$(jq -r '.singbox.commit' core-lock.json)"
          WORK="$RUNNER_TEMP/core-updater-smoke"

          python3 scripts/inject-singbox-android-fix.py "$WORK/singbox"
          python3 scripts/inject-singbox-go127-fix.py "$WORK/singbox"

          # Second run proves idempotence.
          python3 scripts/inject-singbox-android-fix.py "$WORK/singbox" | grep -E 'already patched|already verified'
          python3 scripts/inject-singbox-go127-fix.py "$WORK/singbox" | grep -E 'already patched|already verified'

          (
            cd "$WORK/singbox"
            env GOTOOLCHAIN=auto CGO_ENABLED=0 \
              go test ./protocol/direct ./route ./dns/transport/dhcp

            FORCE_CLOSE_PKGS=(./transport/v2rayxhttp)
            if [[ -d common/force_close ]]; then FORCE_CLOSE_PKGS+=(./common/force_close); fi
            env GOTOOLCHAIN=auto CGO_ENABLED=0 \
              go test -tags badlinkname -ldflags "-checklinkname=0" "${FORCE_CLOSE_PKGS[@]}"
          )

          echo "Backports apply and Go regression/link pins pass on $TAG ($COMMIT)."
      - name: Commit only when tags changed
        run: |
          if git diff --quiet -- core-lock.json; then echo 'No core update.'; exit 0; fi
          git config user.name 'marbleng-core-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add core-lock.json
          git commit -m "chore(cores): update Xray/HEV/sing-box"
          git push origin HEAD:main
