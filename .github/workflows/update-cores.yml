name: Update beta cores
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marbleng-core-updater
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Resolve newest upstream channels
        run: ./scripts/update-core-lock.sh
      - name: Commit only when tags changed
        run: |
          if git diff --quiet -- core-lock.json; then echo 'No core update.'; exit 0; fi
          git config user.name 'marbleng-core-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add core-lock.json
          git commit -m "chore(cores): update Xray/HEV"
          git push origin HEAD:main
