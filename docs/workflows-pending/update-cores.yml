name: Update beta cores
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marbleng-core-updater
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Resolve newest upstream channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-core-lock.sh
      - name: Validate the resolved lock
        shell: bash
        run: |
          set -euo pipefail
          # MARBLE_SINGBOX_CORE_V151 — three cores now, and this job pushes straight to main, so a
          # half-resolved lock must die here rather than in somebody's release build.
          jq -e '.xray.tag and .xray.repo' core-lock.json
          jq -e '.hev.tag and .hev.repo' core-lock.json
          jq -e '.singbox.tag and .singbox.repo' core-lock.json
          [[ "$(jq -r '.singbox.channel' core-lock.json)" == "beta" ]]
          jq -r '"xray \(.xray.tag)  hev \(.hev.tag)  singbox \(.singbox.tag)"' core-lock.json

          # MARBLE_SINGBOX_ANDROID_CLI_CRASH_V157 — the Android core is compiled from source, so
          # the lock has to name the commit the tag resolved to, and MarbleNG's backport level has
          # to survive the rewrite (update-core-lock.sh only touches tags, commit, digest, date).
          [[ "$(jq -r '.singbox.commit' core-lock.json)" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$(jq -r '.singbox.patch // empty' core-lock.json)" ]]
          jq -e '.singbox.sha256 | length == 1' core-lock.json
      - name: Prove the Android crash backport still applies
        shell: bash
        run: |
          set -euo pipefail
          # This job pushes straight to main. A newer sing-box tag whose source moved one of the
          # backport anchors would make every release build die inside prepare-native.sh, minutes
          # into a four-ABI compile. Dry-running the injector here turns that into a one-minute
          # failure in the updater, and keeps the lock honest about what it pins.
          #
          # MARBLE_SINGBOX_GO127_FORCE_CLOSE_V161: the Go 1.27 force-close injector is dry-run
          # here for the same reason. Its anchors are the ones a newer fork tag is most likely to
          # move (it deletes a linkname block out of v2rayxhttp/dialer.go), and the Xray pin this
          # same job resolves decides the toolchain that makes that block fatal — a bump of either
          # pin can break the release build, so both injectors have to keep applying.
          REPO="$(jq -r '.singbox.repo' core-lock.json)"
          TAG="$(jq -r '.singbox.tag' core-lock.json)"
          COMMIT="$(jq -r '.singbox.commit' core-lock.json)"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          git clone --quiet --depth 1 --branch "$TAG" \
            "https://github.com/${REPO}.git" "$WORK/singbox"

          test "$(git -C "$WORK/singbox" rev-parse HEAD)" = "$COMMIT"

          python3 scripts/inject-singbox-android-fix.py "$WORK/singbox"
          python3 scripts/inject-singbox-go127-fix.py "$WORK/singbox"
          # MARBLE_SINGBOX_PINNED_PEER_V164 — the certificate-pinning backport is the third
          # patch of the pinned source: its anchors (the TLS option block, both client builders,
          # both link parsers) are exactly what a newer fork tag is likely to move, and the
          # verifier is a whole new file. A tag this injector cannot patch must not be pushed.
          python3 scripts/inject-singbox-tls-pinning.py "$WORK/singbox"

          echo "Backports apply cleanly to $TAG ($COMMIT)."
          echo "If a future tag already carries the fork's own v2rayxhttp go1.27 split,"
          echo "inject-singbox-go127-fix.py reports 'already patched' and can be retired."
      - name: Commit only when tags changed
        run: |
          if git diff --quiet -- core-lock.json; then echo 'No core update.'; exit 0; fi
          git config user.name 'marbleng-core-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add core-lock.json
          git commit -m "chore(cores): update Xray/HEV/sing-box"
          git push origin HEAD:main
