# MARBLE_TOOLCHAIN_AUTOPILOT_V211 — the one file every build reads for versions.
#
# Written by `scripts/resolve-toolchain.py --write` (the scheduled toolchain autopilot)
# and read by `settings.gradle.kts`, `gradlew` and `.github/workflows/*.yml`. Nothing else
# in the tree names a version: a second copy is a version that drifts.
#
# `line` in the resolver decides how far the autopilot may move a value on its own:
# Gradle/AGP/Kotlin move inside their major, androidx inside its minor, the Compose BOM
# inside its year. Anything bigger is reported as `newerMajor` for a human to take.

